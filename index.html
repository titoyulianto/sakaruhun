<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sakaruhun - Sadulur Sadesa</title>
    
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS (Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- D3.js (Visualisasi Silsilah) -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        .bg-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .leaflet-container { z-index: 10 !important; }
        
        /* CSS Khusus untuk D3.js Nodes & Links */
        .node circle { fill: #10b981; stroke: #fff; stroke-width: 2px; }
        .node text { font-size: 10px; font-weight: 800; fill: #1e293b; font-family: 'Plus Jakarta Sans', sans-serif; }
        .node text.status { font-size: 8px; font-weight: 600; fill: #059669; }
        .link { fill: none; stroke: #cbd5e1; stroke-width: 2px; }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- HEADER -->
    <header class="bg-emerald-700 w-full rounded-b-[2.5rem] shadow-lg relative pt-10 pb-16 px-5 bg-pattern">
        <div class="max-w-md mx-auto relative z-10 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl text-white mb-3 shadow-sm">
                <i class="fas fa-tree text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight mb-1">Sakaruhun</h1>
            <p class="text-emerald-100 text-xs tracking-widest uppercase font-semibold">Sadulur Sadesa</p>
            
            <div class="mt-6 relative">
                <input type="text" placeholder="Cari dulur atau karuhun..." class="w-full bg-white py-3.5 pl-12 pr-5 rounded-2xl text-sm font-semibold text-slate-700 shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all">
                <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
            </div>
            <div class="mt-3 text-[10px] text-emerald-200">
                <i class="fas fa-users mr-1"></i> Terhubung: <strong id="stats-warga">6 Warga</strong>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-md mx-auto px-5 -mt-6 relative z-20 space-y-5">
        
        <!-- MENU GRID -->
        <div class="grid grid-cols-2 gap-4">
            <button class="bg-emerald-50 p-4 rounded-2xl shadow-sm border border-emerald-200 flex flex-col items-center justify-center gap-3 ring-2 ring-emerald-400 ring-offset-1">
                <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
                    <i class="fas fa-network-wired text-xl animate-pulse"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-700">Pohon Karuhun</span>
                    <span class="block text-[9px] text-slate-500 mt-0.5">Lihat grafis silsilah</span>
                </div>
            </button>
            <button class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 hover:bg-amber-50 transition-colors">
                <div class="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center text-amber-600">
                    <i class="fas fa-map-location-dot text-xl"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-700">Peta Lembur</span>
                    <span class="block text-[9px] text-slate-500 mt-0.5">Sebaran rumah warga</span>
                </div>
            </button>
        </div>

        <!-- KANVAS SILSILAH D3.JS -->
        <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 class="text-sm font-bold text-slate-800"><i class="fas fa-sitemap text-emerald-600 mr-1.5"></i> Kaki-Kaki Silsilah</h2>
                <span class="text-[9px] text-emerald-700 bg-emerald-100 px-2 py-1 rounded-full font-semibold border border-emerald-200">Interaktif</span>
            </div>
            
            <!-- Wadah D3.js -->
            <div id="tree-container" class="w-full h-[350px] rounded-2xl border border-slate-200 shadow-inner bg-slate-50 overflow-hidden cursor-move relative">
                <div class="absolute top-2 left-2 flex gap-2 z-10">
                    <button class="bg-white border border-slate-300 w-6 h-6 rounded flex items-center justify-center text-xs text-slate-600 shadow-sm" id="zoom-in"><i class="fas fa-plus"></i></button>
                    <button class="bg-white border border-slate-300 w-6 h-6 rounded flex items-center justify-center text-xs text-slate-600 shadow-sm" id="zoom-out"><i class="fas fa-minus"></i></button>
                </div>
            </div>
            <p class="text-[10px] text-center text-slate-400 mt-3 font-medium"><i class="fas fa-hand-pointer mr-1"></i> Geser layar & gunakan dua jari untuk zoom.</p>
        </section>

        <!-- KANVAS PETA LEAFLET -->
        <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 class="text-sm font-bold text-slate-800"><i class="fas fa-map-pin text-amber-600 mr-1.5"></i> Radar Peta Desa</h2>
            </div>
            <div id="map" class="w-full h-[250px] rounded-2xl border border-slate-200 shadow-inner bg-slate-50"></div>
        </section>
        
    </main>

    <!-- FAB LOGIN -->
    <button class="fixed bottom-6 right-6 w-12 h-12 bg-emerald-600 text-white rounded-full shadow-[0_8px_20px_rgba(5,150,105,0.4)] flex justify-center items-center text-lg hover:bg-emerald-700 transition-all z-50">
        <i class="fas fa-user"></i>
    </button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Script Eksekusi Peta & Silsilah -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==========================================
            // 1. EKSEKUSI PETA (LEAFLET.JS)
            // ==========================================
            const map = L.map('map').setView([-6.8320, 108.2140], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            const dataWarga = [
                { id: "W01", nama: "Aki Wahab", status: "Karuhun", lat: -6.8320, lng: 108.2140 },
                { id: "W02", nama: "Keluarga Mang Ujang", status: "Anak (Gen-2)", lat: -6.8345, lng: 108.2162 },
                { id: "W03", nama: "Keluarga Bi Iroh", status: "Anak (Gen-2)", lat: -6.8305, lng: 108.2115 }
            ];

            dataWarga.forEach(warga => {
                L.marker([warga.lat, warga.lng]).addTo(map).bindPopup(`<b>${warga.nama}</b><br><span style="font-size:10px">${warga.status}</span>`);
            });
            setTimeout(() => { map.invalidateSize(); }, 500);

            // ==========================================
            // 2. EKSEKUSI POHON SILSILAH (D3.JS)
            // ==========================================
            // Data Dummy Silsilah Keluarga (JSON Hierarki)
            const treeData = {
                name: "Aki Wahab",
                status: "Karuhun (Gen-1)",
                children: [
                    {
                        name: "Mang Ujang",
                        status: "Anak (Gen-2)",
                        children: [
                            { name: "Asep", status: "Incu (Gen-3)" },
                            { name: "Euis", status: "Incu (Gen-3)" }
                        ]
                    },
                    {
                        name: "Bi Iroh",
                        status: "Anak (Gen-2)",
                        children: [
                            { name: "Jajang", status: "Incu (Gen-3)" }
                        ]
                    }
                ]
            };

            // Setup Kanvas D3
            const container = document.getElementById('tree-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            const svg = d3.select("#tree-container").append("svg")
                .attr("width", width)
                .attr("height", height);

            // Bikin Group utama yang bisa di-zoom & pan
            const g = svg.append("g");

            // Setup fitur Zoom & Pan
            const zoom = d3.zoom()
                .scaleExtent([0.5, 3]) // Limit zoom in/out
                .on("zoom", (event) => { g.attr("transform", event.transform); });
            svg.call(zoom);

            // Setup Layout Tree (Horizontal)
            const treeLayout = d3.tree().size([height - 60, width - 120]);
            
            // Konversi JSON ke bentuk Hierarki Node D3
            const root = d3.hierarchy(treeData);
            treeLayout(root);

            // Render Garis Hubung (Edges)
            g.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y + 40) // Geser sedikit biar ga nabrak teks
                    .y(d => d.x)
                );

            // Render Titik (Nodes)
            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.y + 40},${d.x})`);

            // Lingkaran Node
            node.append("circle").attr("r", 8);

            // Teks Nama Warga
            node.append("text")
                .attr("dy", -12) // Posisi teks di atas titik
                .attr("x", 0)
                .style("text-anchor", "middle")
                .text(d => d.data.name);

            // Teks Status (Karuhun/Anak/Incu)
            node.append("text")
                .attr("class", "status")
                .attr("dy", 18) // Posisi teks di bawah titik
                .attr("x", 0)
                .style("text-anchor", "middle")
                .text(d => d.data.status);

            // Pusatkan kamera awal agak ke tengah
            svg.call(zoom.transform, d3.zoomIdentity.translate(20, 20));

            // Fungsionalitas Tombol Zoom UI
            d3.select("#zoom-in").on("click", () => svg.transition().call(zoom.scaleBy, 1.3));
            d3.select("#zoom-out").on("click", () => svg.transition().call(zoom.scaleBy, 0.7));
        });
    </script>
</body>
</html>
