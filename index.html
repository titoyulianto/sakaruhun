<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f1f5f9; overflow-x: hidden;}
.bg-pattern{background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23ffffff' stroke-opacity='.12'%3E%3Cpath d='M30 0v60M0 30h60'/%3E%3C/g%3E%3C/svg%3E")}
#tree-container{width:100%; height:80vh; min-height:600px; overflow:hidden; position:relative; touch-action:none; background:#ffffff;}
.node{cursor:pointer; pointer-events:all;}
.node circle{stroke:#fff;stroke-width:2; pointer-events:all; transition:stroke 0.2s, transform 0.2s;}
.node.laki circle{fill:#3b82f6}
.node.perempuan circle{fill:#ec4899}
.node text{font-size:12px;font-weight:800;fill:#1e293b;pointer-events:none; user-select:none;}
.node text.status{font-size:10px;font-weight:600;fill:#059669}
.link{fill:none;stroke:#cbd5e1;stroke-width:2;pointer-events:none}
.spouse-link{fill:none;stroke:#ec4899;stroke-width:2;stroke-dasharray:4 4;pointer-events:none}
#map{height:300px; z-index: 10; width:100%;}
.leaflet-container { z-index: 10 !important; }
.modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter: blur(4px);}
.modal.open{display:flex !important}
.modal-card{background:white;border-radius:24px;padding:24px;width:100%;max-width:450px;max-height:90vh;overflow-y:auto;box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);}

/* Geni-Style Action Badges (D3 Embedded) */
.action-badge { cursor: pointer; transition: all 0.2s; pointer-events: all; }
.action-badge rect { stroke-width: 1px; rx: 4px; ry: 4px; }
.action-badge.blue rect { fill: #dbeafe; stroke: #93c5fd; }
.action-badge.blue text { fill: #1d4ed8; font-weight: bold; font-size: 10px; text-anchor: middle; pointer-events: none;}
.action-badge.pink rect { fill: #fce7f3; stroke: #f9a8d4; }
.action-badge.pink text { fill: #be185d; font-weight: bold; font-size: 10px; text-anchor: middle; pointer-events: none;}
.action-badge.green rect { fill: #d1fae5; stroke: #6ee7b7; }
.action-badge.green text { fill: #047857; font-weight: bold; font-size: 10px; text-anchor: middle; pointer-events: none;}
.action-badge.gray rect { fill: #f1f5f9; stroke: #cbd5e1; }
.action-badge.gray text { fill: #475569; font-weight: bold; font-size: 10px; text-anchor: middle; pointer-events: none;}
.action-badge:hover rect { filter: brightness(0.95); stroke-width: 2px; }

/* Selection Outline */
.node.selected circle { stroke: #f59e0b; stroke-width: 4px; filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.5)); }
</style>
</head>

<body class="text-slate-800 flex flex-col min-h-screen">

                <div class="flex gap-2 pt-2">

                    </button>
                    <button id="btn-hapus-data" type="button" class="bg-red-100 hover:bg-red-200 text-red-600 rounded-xl px-5 transition-colors font-bold" title="Hapus Permanen">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // ==========================================
        // WINDOW EXPORTS AGAR BISA DI PANGGIL OLEH KLIK D3
        // ==========================================
        window.$ = id => document.getElementById(id);
        
        window.showModal = function(id) { window.$(id).classList.add("open"); };
        window.hideModal = function(id) { window.$(id).classList.remove("open"); };
        window.notify = function(msg) { alert(msg); };
        window.escapeHtml = function(v) { return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); };

        window.openTambahModal = function(context, targetKey, targetName, targetGender) {
            window.$("form-tambah").reset();
            window.$("tambah-context").value = context;
            window.$("tambah-target").value = targetKey || "";
            const title = window.$("modal-tambah-title");

            if (context === 'ADD_CHILD') {
                title.innerHTML = `<i class="fas fa-child text-emerald-600 mr-2"></i>Bikin Anak Baru dari ${escapeHtml(targetName)}`;
            } else if (context === 'ADD_SPOUSE') {
                title.innerHTML = `<i class="fas fa-heart text-pink-500 mr-2"></i>Bikin Pasangan Baru untuk ${escapeHtml(targetName)}`;
                window.$("select-gender").value = targetGender === 'L' ? 'P' : 'L';
            } else if (context === 'ADD_PARENT_FATHER') {
                title.innerHTML = `<i class="fas fa-male text-blue-600 mr-2"></i>Bikin Ayah Baru untuk ${escapeHtml(targetName)}`;
                window.$("select-gender").value = "L";
            } else if (context === 'ADD_PARENT_MOTHER') {
                title.innerHTML = `<i class="fas fa-female text-pink-600 mr-2"></i>Bikin Ibu Baru untuk ${escapeHtml(targetName)}`;
                window.$("select-gender").value = "P";
            } else {
                title.innerHTML = `<i class="fas fa-user-secret text-purple-600 mr-2"></i>Bikin Garis Keturunan Baru`;
            }
            window.showModal('modal-tambah');
            setTimeout(() => window.$("input-nama").focus(), 100);
        };

        window.bukaModalEditGeni = function(key, nama, gender, dusun, rt, rw) {
            window.$("edit-dbkey").value = key;
            window.$("edit-nama").value = nama;
            window.$("edit-gender").value = gender;
            window.$("edit-dusun").value = dusun || "";
            window.$("edit-rt").value = rt || "";
            window.$("edit-rw").value = rw || "";
            
            window.showModal('modal-edit');
        };

        // ==========================================
        // FIREBASE SETUP & STATE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA0JmHvkhB5oXPvnDMvcHJyooqSsLIccGQ",
            authDomain: "sakaruhun-desa.firebaseapp.com",
            databaseURL: "https://sakaruhun-desa-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "sakaruhun-desa",
            storageBucket: "sakaruhun-desa.firebasestorage.app",
            messagingSenderId: "69221074382",
            appId: "1:69221074382:web:b15104ddc2618c1c70979f"
        };

        const DB_PATH = "silsilah_desa_v3";
        let db, wargaRef;
        let dataMap = {};
        let dataGlobal = [];
        let map, layerGroup;
        let nodeSelection = null;
        let zoomBehavior = null;
        let treeReady = false;
        let isDragMode = false;
        let selectedNodeId = null; 

        function normalizeData(raw) {
            const result = {};
            Object.entries(raw || {}).forEach(([key, v]) => {
                if (!v || typeof v !== "object") return;
                
                // Jaga compatibility dan pastikan data aman dicari
                let nameStr = String(v.nama || v.name || "Tanpa Nama").trim();
                let sIds = [];
                if (Array.isArray(v.spouseIds)) { sIds = v.spouseIds; } 
                else if (v.spouseId) { sIds = [v.spouseId]; }

                result[key] = {
                    dbKey: key,
                    nama: nameStr,
                    name: nameStr, 
                    gender: v.gender === "P" ? "P" : "L",
                    parentId: v.parentId || "",
                    fatherId: v.fatherId || "", 
                    motherId: v.motherId || "",
                    spouseIds: sIds,
                    dusun: v.dusun || '', rt: v.rt || '', rw: v.rw || '',
                    lat: Number(v.lat) || -6.832,
                    lng: Number(v.lng) || 108.214,
                    manualX: (v.manualX != null && !isNaN(v.manualX)) ? Number(v.manualX) : null,
                    manualY: (v.manualY != null && !isNaN(v.manualY)) ? Number(v.manualY) : null
                };
            });
            // Bersihkan relasi yatim
            Object.values(result).forEach(p => {
                if (p.parentId && !result[p.parentId]) { p.parentId = ""; }
                if (p.fatherId && !result[p.fatherId]) { p.fatherId = ""; }
                if (p.motherId && !result[p.motherId]) { p.motherId = ""; }
            });
            return result;
        }

        function initMap() {
            if (!window.L || map) return;
            map = L.map("map").setView([-6.832, 108.214], 15);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
            layerGroup = L.layerGroup().addTo(map);
            setTimeout(() => map.invalidateSize(), 400);
        }

        function drawMap() {
            if (!map || !layerGroup) return;
            layerGroup.clearLayers();
            dataGlobal.forEach(p => {
                if (Number.isFinite(p.lat) && Number.isFinite(p.lng)) {
                    L.marker([p.lat, p.lng]).addTo(layerGroup).bindPopup(`<b>${escapeHtml(p.nama)}</b><br><span style="font-size:10px">Dusun ${escapeHtml(p.dusun)}</span>`);
                }
            });
        }

        function renderTree() {
            if (!window.d3) return;
            const container = window.$("tree-container");
            const width = Math.max(container.clientWidth, 600);
            const height = Math.max(container.clientHeight, 500);

            const svg = d3.select(container).selectAll("svg").data([null]).join("svg")
                .attr("width", "100%").attr("height", "100%").attr("viewBox", `0 0 ${width} ${height}`);

            svg.selectAll("*").remove();
            
            if (dataGlobal.length === 0) {
                window.$("empty-state-msg").classList.remove("hidden");
                window.$("empty-state-msg").classList.add("flex");
                treeReady = true;
                return;
            } else {
                window.$("empty-state-msg").classList.add("hidden");
                window.$("empty-state-msg").classList.remove("flex");
            }
            
            // Background Click untuk Deselect Geni UI
            svg.on("click", () => {
                if(selectedNodeId) {
                    selectedNodeId = null;
                    renderTree();
                }
            });

            const gSVG = svg.append("g");
            zoomBehavior = d3.zoom().scaleExtent([.1, 3]).on("zoom", e => gSVG.attr("transform", e.transform));
            svg.call(zoomBehavior).on("dblclick.zoom", null);

            try {
                let primary = dataGlobal.map(d => ({...d}));
                const byIdGlobal = new Map(primary.map(p => [p.dbKey, p]));
                
                const spouseOf = new Map();
                const isSpouseNode = new Set();
                const primaryOf = {}; // Untuk mencegah parent putus
                const renderedPairs = new Set();
                
                primary.forEach(p => {
                    const sList = p.spouseIds || [];
                    sList.forEach(sId => {
                        if (!byIdGlobal.has(sId)) return;
                        
                        const pairKey = [p.dbKey, sId].sort().join("::");
                        if (!renderedPairs.has(pairKey)) {
                            renderedPairs.add(pairKey);
                            const p2 = byIdGlobal.get(sId);
                            let main = p.dbKey;
                            let spouse = sId;
                            
                            // Kalau pasangannya punya ortu, dia harus di tree utama
                            if (p2.fatherId || p2.motherId || p2.parentId) {
                                main = sId;
                                spouse = p.dbKey;
                            }
                            
                            isSpouseNode.add(spouse);
                            primaryOf[spouse] = main;
                            
                            if(!spouseOf.has(main)) spouseOf.set(main, []);
                            if(!spouseOf.get(main).includes(spouse)) spouseOf.get(main).push(spouse);
                        }
                    });
                });

                // Set ulang parent (anak ngikut ke parent utama biar ga ilang)
                primary.forEach(p => {
                    let rawParent = p.fatherId || p.motherId || p.parentId;
                    if (rawParent && isSpouseNode.has(rawParent)) {
                        p.parentId = primaryOf[rawParent];
                    } else {
                        p.parentId = rawParent;
                    }
                });

                // Filter dan cegah loop (Cycle Detection)
                let treeNodes = primary.filter(p => !isSpouseNode.has(p.dbKey));
                const treeNodeIds = new Set(treeNodes.map(p => p.dbKey));

                treeNodes.forEach(p => {
                    if (p.parentId && !treeNodeIds.has(p.parentId)) p.parentId = ""; 
                });

                treeNodes.forEach(p => {
                    let curr = p.parentId;
                    let visited = new Set([p.dbKey]);
                    let cycle = false;
                    while(curr && curr !== "") {
                        if (visited.has(curr)) { cycle = true; break; }
                        visited.add(curr);
                        let nextNode = treeNodes.find(n => n.dbKey === curr);
                        curr = nextNode ? nextNode.parentId : "";
                    }
                    if (cycle) p.parentId = "";
                });

                // Tampung root dummy
                let roots = treeNodes.filter(p => !p.parentId || p.parentId === "");
                const DUMMY_ROOT = "DUMMY_INVISIBLE_ROOT";
                if (roots.length > 1) {
                    treeNodes.push({ dbKey: DUMMY_ROOT, nama: "", gender: "L", parentId: "", isDummy: true });
                    roots.forEach(r => r.parentId = DUMMY_ROOT);
                } else if (roots.length === 0 && treeNodes.length > 0) {
                    treeNodes[0].parentId = "";
                }

                const root = d3.stratify().id(d => d.dbKey).parentId(d => d.parentId)(treeNodes);
                d3.tree().nodeSize([320, 180])(root);
                const nodes = root.descendants();
                
                nodes.forEach(n => {
                    if (n.data.manualX !== null && n.data.manualX !== undefined) n.x = n.data.manualX;
                    if (n.data.manualY !== null && n.data.manualY !== undefined) n.y = n.data.manualY;
                });

                const spousePositions = [];
                nodes.forEach(n => {
                    if(n.data.isDummy) return;
                    const spIds = spouseOf.get(n.data.dbKey) || [];
                    spIds.forEach((id, idx) => {
                        const person = byIdGlobal.get(id);
                        if(person) {
                            let sx = n.x + 180, sy = n.y + (idx * 60); 
                            if (person.manualX !== null && person.manualX !== undefined) sx = person.manualX;
                            if (person.manualY !== null && person.manualY !== undefined) sy = person.manualY;
                            spousePositions.push({ data: person, source: n, x: sx, y: sy, isSpouse: true });
                        }
                    });
                });

                const drawNodes = [];
                nodes.forEach(n => { if(!n.data.isDummy) drawNodes.push(n); });
                spousePositions.forEach(s => { drawNodes.push(s); });

                // GAMBAR GARIS 
                const validLinks = root.links().filter(l => !l.source.data.isDummy);
                gSVG.selectAll(".link").data(validLinks).join("path").attr("class", "link")
                    .attr("d", d => {
                        let startX = d.source.x, startY = d.source.y;
                        const spData = spousePositions.find(sp => sp.source.data.dbKey === d.source.data.dbKey);
                        if (spData) { startX = (spData.source.x + spData.x) / 2; startY = (spData.source.y + spData.y) / 2; }
                        return `M${startX},${startY} V${(startY + d.target.y) / 2} H${d.target.x} V${d.target.y}`;
                    });
                
                // Extra link dari istri ke bapaknya
                const extraLinks = [];
                spousePositions.forEach(sp => {
                    let pId = sp.data.fatherId || sp.data.motherId || sp.data.parentId;
                    if (pId) {
                        const pNode = drawNodes.find(n => n.data.dbKey === pId);
                        if (pNode) extraLinks.push({ source: pNode, target: sp });
                    }
                });
                gSVG.selectAll(".extra-link").data(extraLinks).join("path").attr("class", "link extra-link")
                    .attr("d", l => `M${l.source.x},${l.source.y} V${(l.source.y + l.target.y) / 2} H${l.target.x} V${l.target.y}`);

                gSVG.selectAll(".spouse-link").data(spousePositions).join("path").attr("class", "spouse-link")
                    .attr("d", sp => `M${sp.source.x+17},${sp.source.y} L${sp.x-17},${sp.y}`);

                // NODE
                nodeSelection = gSVG.selectAll(".node").data(drawNodes).join("g")
                    .attr("class", d => `node ${d.data.gender === "P" ? "perempuan" : "laki"} ${d.data.dbKey === selectedNodeId ? "selected" : ""}`)
                    .attr("transform", d => `translate(${d.x},${d.y})`);

                const dragBehavior = d3.drag()
                    .filter(() => isDragMode)
                    .on("start", function(event, d) {
                        d3.select(this).raise().select("circle").attr("stroke", "#ef4444").attr("stroke-width", 4);
                        d3.select(this).style("pointer-events", "none");
                    })
                    .on("drag", function(event, d) {
                        d.x += event.dx; d.y += event.dy;
                        d3.select(this).attr("transform", `translate(${d.x},${d.y})`);
                    })
                    .on("end", async function(event, d) {
                        d3.select(this).style("pointer-events", "all");
                        await update(ref(db, `${DB_PATH}/${d.data.dbKey}`), { manualX: d.x, manualY: d.y });
                        renderTree(); 
                    });

                // EVENT KLIK & UI GENI
                nodeSelection.on("click", (event, d) => {
                    if (isDragMode) return;
                    event.stopPropagation();
                    
                    if (selectedNodeId === d.data.dbKey) {
                        selectedNodeId = null; 
                    } else {
                        selectedNodeId = d.data.dbKey;
                    }
                    renderTree(); 
                }).call(dragBehavior);

                nodeSelection.append("circle").attr("r", 20);
                nodeSelection.append("text").attr("dy", -32).attr("text-anchor", "middle").text(d => d.data.nama.length > 25 ? d.data.nama.slice(0, 23) + "…" : d.data.nama);

                // =========================================================================
                // UI GENI-STYLE: BADGE ACTION (Muncul saat Node diklik)
                // =========================================================================
                nodeSelection.each(function(d) {
                    if (d.data.dbKey === selectedNodeId) {
                        const nodeGroup = d3.select(this);
                        
                        const noFather = !d.data.fatherId || d.data.fatherId === "";
                        const noMother = !d.data.motherId || d.data.motherId === "";

                        // 1. TOMBOL ATAS: TAMBAH AYAH & IBU 
                        if (noFather) {
                            const btnAyah = nodeGroup.append("g").attr("class", "action-badge blue").attr("transform", "translate(-70, -80)")
                                .on("click", (e) => { e.stopPropagation(); window.openTambahModal('ADD_PARENT_FATHER', d.data.dbKey, d.data.nama, 'L'); });
                            btnAyah.append("rect").attr("width", 65).attr("height", 22);
                            btnAyah.append("text").attr("x", 32.5).attr("y", 15).text("+ Ayah");
                            nodeGroup.append("path").attr("d", "M-35,-58 V-20").attr("class", "link"); 
                        }
                        if (noMother) {
                            const btnIbu = nodeGroup.append("g").attr("class", "action-badge pink").attr("transform", "translate(5, -80)")
                                .on("click", (e) => { e.stopPropagation(); window.openTambahModal('ADD_PARENT_MOTHER', d.data.dbKey, d.data.nama, 'P'); });
                            btnIbu.append("rect").attr("width", 65).attr("height", 22);
                            btnIbu.append("text").attr("x", 32.5).attr("y", 15).text("+ Ibu");
                            nodeGroup.append("path").attr("d", "M35,-58 V-20").attr("class", "link"); 
                        }

                        // 2. TOMBOL KANAN: TAMBAH PASANGAN
                        const btnSpouse = nodeGroup.append("g").attr("class", "action-badge gray").attr("transform", "translate(40, -10)")
                            .on("click", (e) => { e.stopPropagation(); window.openTambahModal('ADD_SPOUSE', d.data.dbKey, d.data.nama, d.data.gender === 'L' ? 'P' : 'L'); });
                        btnSpouse.append("rect").attr("width", 75).attr("height", 22);
                        btnSpouse.append("text").attr("x", 37).attr("y", 15).text("+ Pasangan");

                        // 3. TOMBOL BAWAH: TAMBAH ANAK
                        const btnAnak = nodeGroup.append("g").attr("class", "action-badge green").attr("transform", "translate(-35, 50)")
                            .on("click", (e) => { e.stopPropagation(); window.openTambahModal('ADD_CHILD', d.data.dbKey, d.data.nama, null); });
                        btnAnak.append("rect").attr("width", 70).attr("height", 22);
                        btnAnak.append("text").attr("x", 35).attr("y", 15).text("+ Anak");
                        nodeGroup.append("path").attr("d", "M0,20 V50").attr("class", "link");

                        // 4. TOMBOL KIRI: EDIT/KELOLA
                        const btnEdit = nodeGroup.append("g").attr("class", "action-badge gray").attr("transform", "translate(-75, -10)")
                            .on("click", (e) => { e.stopPropagation(); window.bukaModalEditGeni(d.data.dbKey, d.data.nama, d.data.gender, d.data.dusun, d.data.rt, d.data.rw); });
                        btnEdit.append("rect").attr("width", 50).attr("height", 22);
                        btnEdit.append("text").attr("x", 25).attr("y", 15).text("📝 Edit");
                    }
                });

                let validNodes = drawNodes.filter(d => !isNaN(d.x) && !isNaN(d.y));
                if(validNodes.length > 0 && !selectedNodeId) {
                    const extent = d3.extent(validNodes, d => d.x);
                    const extentY = d3.extent(validNodes, d => d.y);
                    let cx = (extent[0] + extent[1]) / 2;
                    let cy = (extentY[0] + extentY[1]) / 2;
                    if(isNaN(cx)) cx = 0; if(isNaN(cy)) cy = 0;
                    svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity.translate(width / 2 - cx, height / 2 - cy + 20));
                }

                treeReady = true;
            } catch (err) {
                console.error("Gagal merender pohon:", err);
            }
        }

        // =========================================================================
        // SCRIPT FIREBASE & ACTIONS
        // =========================================================================
        window.$("form-tambah").addEventListener("submit", async (e) => {
            e.preventDefault();
            const button = window.$("form-tambah").querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                const nama = window.$("input-nama").value.trim();
                const gender = window.$("select-gender").value;
                const dusun = window.$("input-dusun-tambah").value.trim();
                const rt = window.$("input-rt-tambah").value.trim();
                const rw = window.$("input-rw-tambah").value.trim();

                if (!nama) throw new Error("Nama wajib diisi.");
                
                const ctx = window.$("tambah-context").value;
                const targetKey = window.$("tambah-target").value;
                
                const newRef = push(wargaRef);
                let initCoord = randomCoords();
                if (targetKey && dataMap[targetKey]) { initCoord.lat = dataMap[targetKey].lat + 0.001; initCoord.lng = dataMap[targetKey].lng; }
                
                let newRecord = { nama, gender, dusun, rt, rw, fatherId: "", motherId: "", spouseIds: [], ...initCoord };
                await set(newRef, newRecord);
                
                if (ctx === 'ADD_PARENT_FATHER') {
                    await update(ref(db, `${DB_PATH}/${targetKey}`), { fatherId: newRef.key });
                } else if (ctx === 'ADD_PARENT_MOTHER') {
                    await update(ref(db, `${DB_PATH}/${targetKey}`), { motherId: newRef.key });
                } else if (ctx === 'ADD_SPOUSE') {
                    const targetPerson = dataMap[targetKey];
                    let spouses = targetPerson?.spouseIds || [];
                    if (!spouses.includes(newRef.key)) spouses.push(newRef.key);
                    
                    let targetSpouses = [targetKey];
                    await update(ref(db, `${DB_PATH}/${targetKey}`), { spouseIds: spouses });
                    await update(ref(db, `${DB_PATH}/${newRef.key}`), { spouseIds: targetSpouses });
                } else if (ctx === 'ADD_CHILD') {
                    if(dataMap[targetKey].gender === 'L') {
                        await update(ref(db, `${DB_PATH}/${newRef.key}`), { fatherId: targetKey });
                    } else {
                        await update(ref(db, `${DB_PATH}/${newRef.key}`), { motherId: targetKey });
                    }
                }
                
                window.hideModal('modal-tambah');
                selectedNodeId = newRef.key;
                renderTree();
            } catch (err) { window.notify("Gagal menyimpan: " + err.message); } 
            finally { button.disabled = false; }
        });

        window.$("form-edit").addEventListener("submit", async (e) => {
            e.preventDefault();
            const button = window.$("form-edit").querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                const key = window.$("edit-dbkey").value;
                const nama = window.$("edit-nama").value.trim();
                const gender = window.$("edit-gender").value;
                
                const dusun = window.$("edit-dusun").value.trim();
                const rt = window.$("edit-rt").value.trim();
                const rw = window.$("edit-rw").value.trim();
                
                if (!key || !nama) throw new Error("Nama wajib diisi.");

                const updates = { nama, gender, dusun, rt, rw };
                await update(ref(db, `${DB_PATH}/${key}`), updates);

                window.hideModal('modal-edit');
            } catch (err) { window.notify("Gagal memperbarui: " + err.message); } 
            finally { button.disabled = false; }
        });

        window.$("btn-hapus-data").addEventListener("click", async () => {
            const key = window.$("edit-dbkey").value;
            if (!key) return;
            if (!confirm("Hapus individu ini? Relasi anak dan pasangan akan diputuskan.")) return;
            try {
                const updates = {};
                dataGlobal.forEach(p => { 
                    if(p.fatherId === key) updates[`${DB_PATH}/${p.dbKey}/fatherId`] = "";
                    if(p.motherId === key) updates[`${DB_PATH}/${p.dbKey}/motherId`] = "";
                    if(p.parentId === key) updates[`${DB_PATH}/${p.dbKey}/parentId`] = "";
                });
                dataGlobal.forEach(p => {
                    if (p.spouseIds && p.spouseIds.includes(key)) {
                        let newList = p.spouseIds.filter(id => id !== key);
                        updates[`${DB_PATH}/${p.dbKey}/spouseIds`] = newList;
                    }
                });

                if (Object.keys(updates).length) await update(ref(db), updates);
                await remove(ref(db, `${DB_PATH}/${key}`));
                window.hideModal('modal-edit');
                selectedNodeId = null;
            } catch (err) { window.notify("Gagal menghapus: " + err.message); }
        });

        window.$("btn-reset-all-data-main").addEventListener("click", async () => {
            if(prompt("PERINGATAN! Ketik 'HAPUS' untuk mengosongkan seluruh database.") === 'HAPUS') {
                try {
                    await set(ref(db, DB_PATH), null);
                    window.notify("Database berhasil dikosongkan.");
                } catch(e) { window.notify("Gagal mengosongkan data."); }
            }
        });

        function wireEvents() {
            window.$("btn-toggle-drag").addEventListener("click", () => {
                isDragMode = !isDragMode;
                const btn = window.$("btn-toggle-drag");
                const hint = window.$("tree-instruction");
                if (isDragMode) {
                    selectedNodeId = null; 
                    btn.className = "w-full bg-amber-500 text-white p-4 rounded-xl shadow-md flex items-center justify-center gap-3 transition-colors active:scale-95";
                    btn.innerHTML = '<i class="fas fa-arrows-alt text-xl"></i><div class="text-left leading-tight"><strong class="block text-sm">Mode Geser Aktif</strong><span class="block text-[10px] text-amber-200">Geser profil & posisinya akan dikunci.</span></div>';
                } else {
                    btn.className = "w-full bg-slate-100 text-slate-600 border border-slate-200 p-4 rounded-xl shadow-sm flex items-center gap-3 hover:bg-slate-200 transition-colors";
                    btn.innerHTML = '<i class="fas fa-lock text-xl w-6 text-center"></i><div class="text-left leading-tight"><strong class="block text-sm">Silsilah Terkunci</strong><span class="block text-[10px] text-slate-500">Klik untuk geser posisi</span></div>';
                }
                if (treeReady) renderTree();
            });

            window.$("btn-reset-layout").addEventListener("click", async () => {
                if(!confirm("Kembalikan seluruh pohon ke susunan otomatis?")) return;
                try {
                    const updates = {};
                    dataGlobal.forEach(p => {
                        if (p.manualX !== null || p.manualY !== null) {
                            updates[`${DB_PATH}/${p.dbKey}/manualX`] = null;
                            updates[`${DB_PATH}/${p.dbKey}/manualY`] = null;
                        }
                    });
                    if (Object.keys(updates).length > 0) await update(ref(db), updates);
                } catch (err) { window.notify("Gagal reset layout."); }
            });

            window.$("btn-tambah-data-main").addEventListener("click", () => window.openTambahModal('MAIN', '', '', null));
            
            window.$("input-pencarian").addEventListener("input", () => {
                const q = window.$("input-pencarian").value.trim().toLocaleLowerCase("id");
                if (!nodeSelection) return;
                nodeSelection.select("circle")
                    .attr("stroke", d => q && d.data.nama.toLocaleLowerCase("id").includes(q) ? "#f59e0b" : (d.data.dbKey === selectedNodeId ? "#f59e0b" : "#fff"))
                    .attr("stroke-width", d => q && d.data.nama.toLocaleLowerCase("id").includes(q) ? 5 : (d.data.dbKey === selectedNodeId ? 4 : 2));
            });

            window.addEventListener("resize", () => { if (treeReady) renderTree(); if (map) setTimeout(() => map.invalidateSize(), 100); });
        }

        function startFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getDatabase(app);
                wargaRef = ref(db, DB_PATH);
                onValue(wargaRef, async snapshot => {
                    try {
                        const raw = snapshot.val();
                        if (!raw) {
                            dataGlobal = [];
                            dataMap = {};
                            window.$("stats-warga").textContent = "0 Warga";
                            renderTree();
                            drawMap();
                            return;
                        }
                        dataMap = normalizeData(raw);
                        dataGlobal = Object.values(dataMap);
                        window.$("stats-warga").textContent = `${dataGlobal.length} Warga Terdaftar`;
                        
                        renderTree();
                        drawMap();
                    } catch (err) { window.notify("Data terbaca tetapi gagal ditampilkan: " + err.message); }
                });
            } catch (err) { window.notify("Firebase gagal diinisialisasi: " + err.message); }
        }

        wireEvents();
        try { initMap(); } catch (err) {}
        startFirebase();
    </script>
</body>
</html>
