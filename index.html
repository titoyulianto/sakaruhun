<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sakaruhun - Sadulur Sadesa</title>
    
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS (Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        .bg-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        /* Penyesuaian z-index Leaflet agar tidak bentrok dengan tombol melayang */
        .leaflet-container { z-index: 10 !important; }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- HEADER -->
    <header class="bg-emerald-700 w-full rounded-b-[2.5rem] shadow-lg relative pt-10 pb-16 px-5 bg-pattern">
        <div class="max-w-md mx-auto relative z-10 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl text-white mb-3 shadow-sm">
                <i class="fas fa-tree text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight mb-1">Sakaruhun</h1>
            <p class="text-emerald-100 text-xs tracking-widest uppercase font-semibold">Sadulur Sadesa</p>
            
            <div class="mt-6 relative">
                <input type="text" placeholder="Cari dulur atau karuhun..." class="w-full bg-white py-3.5 pl-12 pr-5 rounded-2xl text-sm font-semibold text-slate-700 shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all">
                <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
            </div>
            <div class="mt-3 text-[10px] text-emerald-200">
                <i class="fas fa-users mr-1"></i> Terhubung: <strong id="stats-warga">3 Warga</strong>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-md mx-auto px-5 -mt-6 relative z-20 space-y-5">
        
        <!-- MENU GRID -->
        <div class="grid grid-cols-2 gap-4">
            <button class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 hover:bg-emerald-50 transition-colors">
                <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
                    <i class="fas fa-network-wired text-xl"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-700">Pohon Karuhun</span>
                    <span class="block text-[9px] text-slate-500 mt-0.5">Lihat grafis silsilah</span>
                </div>
            </button>
            <button class="bg-amber-50 p-4 rounded-2xl shadow-sm border border-amber-200 flex flex-col items-center justify-center gap-3 ring-2 ring-amber-400 ring-offset-1">
                <div class="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center text-amber-600">
                    <i class="fas fa-map-location-dot text-xl animate-bounce"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-700">Peta Lembur</span>
                    <span class="block text-[9px] text-slate-500 mt-0.5">Sebaran rumah warga</span>
                </div>
            </button>
        </div>

        <!-- KANVAS PETA (Menggantikan Area Kode Sebelumnya) -->
        <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 class="text-sm font-bold text-slate-800"><i class="fas fa-map-pin text-amber-600 mr-1.5"></i> Radar Peta Desa</h2>
                <span class="text-[9px] text-amber-700 bg-amber-100 px-2 py-1 rounded-full font-semibold border border-amber-200">Mode Pratinjau</span>
            </div>
            
            <!-- Wadah Peta Leaflet -->
            <div id="map" class="w-full h-[300px] rounded-2xl border border-slate-200 shadow-inner bg-slate-50"></div>
            
            <p class="text-[10px] text-center text-slate-400 mt-3 font-medium">Klik ikon pin di peta untuk melihat detail keluarga.</p>
        </section>
    </main>

    <!-- FAB LOGIN -->
    <button class="fixed bottom-6 right-6 w-12 h-12 bg-emerald-600 text-white rounded-full shadow-[0_8px_20px_rgba(5,150,105,0.4)] flex justify-center items-center text-lg hover:bg-emerald-700 transition-all z-50">
        <i class="fas fa-user"></i>
    </button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Script Eksekusi Peta -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Inisialisasi Peta (Koordinat di-set default ke titik acak di Jawa Barat)
            // Format: [Latitude, Longitude], Zoom Level
            const map = L.map('map').setView([-6.8320, 108.2140], 15);

            // 2. Load Desain Peta dari OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // 3. Data Dummy Warga (Nanti ini diganti tarikan data dari Firebase/Database)
            const dataWarga = [
                { id: "W01", nama: "Aki Wahab", status: "Sesepuh Desa (Generasi 1)", lat: -6.8320, lng: 108.2140, warna: "red" },
                { id: "W02", nama: "Keluarga Mang Ujang", status: "Anak Aki Wahab (Generasi 2)", lat: -6.8345, lng: 108.2162, warna: "blue" },
                { id: "W03", nama: "Keluarga Bi Iroh", status: "Anak Aki Wahab (Generasi 2)", lat: -6.8305, lng: 108.2115, warna: "blue" }
            ];

            // 4. Render Pin ke Peta
            dataWarga.forEach(warga => {
                const marker = L.marker([warga.lat, warga.lng]).addTo(map);
                
                // Desain Balon Pop-up saat pin diklik
                const popupKonten = `
                    <div class="text-center font-sans p-1">
                        <div class="w-10 h-10 bg-slate-100 rounded-full mx-auto mb-2 flex items-center justify-center border border-slate-200">
                            <i class="fas fa-home text-slate-500"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-xs mb-0.5">${warga.nama}</h3>
                        <p class="text-[9px] text-emerald-600 mb-2">${warga.status}</p>
                        <button class="bg-slate-900 text-white text-[9px] px-3 py-1.5 rounded-lg w-full hover:bg-emerald-600 transition-colors">Lihat Silsilah</button>
                    </div>
                `;
                marker.bindPopup(popupKonten);
            });
            
            // Fix bug tiles peta ga render full di mobile
            setTimeout(() => { map.invalidateSize(); }, 500);
        });
    </script>

</body>
</html>
