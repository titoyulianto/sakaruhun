<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sakaruhun - Sadulur Sadesa</title>
    
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS (Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <!-- D3.js (Visualisasi Silsilah) -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .bg-pattern { background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4H6zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        .leaflet-container { z-index: 10 !important; }
        
        /* CSS Khusus untuk D3.js Nodes & Links */
        .node circle { stroke: #fff; stroke-width: 2px; transition: all 0.2s; cursor: pointer; }
        .node.laki circle { fill: #3b82f6; } /* Biru untuk Laki-laki */
        .node.perempuan circle { fill: #ec4899; } /* Pink untuk Perempuan */
        .node:hover circle { fill: #f59e0b; transform: scale(1.4); } 
        .node text { font-size: 11px; font-weight: 800; fill: #1e293b; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; pointer-events: none;}
        .node text.status { font-size: 9px; font-weight: 600; fill: #059669; pointer-events: none;}
        .link { fill: none; stroke: #cbd5e1; stroke-width: 2px; }
        .spouse-link { fill: none; stroke: #ec4899; stroke-width: 2px; stroke-dasharray: 4,4; }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- HEADER -->
    <header class="bg-emerald-700 w-full rounded-b-[2.5rem] shadow-lg relative pt-10 pb-16 px-5 bg-pattern">
        <div class="max-w-md mx-auto relative z-10 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl text-white mb-3 shadow-sm">
                <i class="fas fa-tree text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight mb-1">Sakaruhun</h1>
            <p class="text-emerald-100 text-xs tracking-widest uppercase font-semibold">Sadulur Sadesa</p>
            
            <div class="mt-6 relative">
                <input type="text" placeholder="Cari dulur atau karuhun..." class="w-full bg-white py-3.5 pl-12 pr-5 rounded-2xl text-sm font-semibold text-slate-700 shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all">
                <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
            </div>
            <div class="mt-3 text-[10px] text-emerald-200">
                <i class="fas fa-users mr-1"></i> Terhubung: <strong id="stats-warga">0 Warga</strong>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-md mx-auto px-5 -mt-6 relative z-20 space-y-5">
        
        <div class="grid grid-cols-2 gap-4">
            <button class="bg-emerald-50 p-4 rounded-2xl shadow-sm border border-emerald-200 flex flex-col items-center justify-center gap-3 ring-2 ring-emerald-400 ring-offset-1">
                <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
                    <i class="fas fa-network-wired text-xl animate-pulse"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-700">Pohon Karuhun</span>
                    <span class="block text-[9px] text-slate-500 mt-0.5">Lihat grafis silsilah</span>
                </div>
            </button>
            <button id="btn-tambah-data" class="bg-purple-600 p-4 rounded-2xl shadow-md border border-purple-500 flex flex-col items-center justify-center gap-3 hover:bg-purple-700 transition-colors active:scale-95 cursor-pointer text-white">
                <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-white">
                    <i class="fas fa-user-plus text-xl"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold">Tambah Data</span>
                    <span class="block text-[9px] text-purple-200 mt-0.5">Isi silsilah keluarga</span>
                </div>
            </button>
        </div>

        <!-- KANVAS SILSILAH D3.JS -->
        <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 class="text-sm font-bold text-slate-800"><i class="fas fa-sitemap text-emerald-600 mr-1.5"></i> Pohon Silsilah Mandiri</h2>
                <span class="text-[9px] text-emerald-700 bg-emerald-100 px-2 py-1 rounded-full font-semibold border border-emerald-200">Individu & Pasangan</span>
            </div>
            <div id="tree-container" class="w-full h-[420px] rounded-2xl border border-slate-200 shadow-inner bg-slate-50 overflow-hidden cursor-move relative"></div>
            <p class="text-[10px] text-center text-emerald-600 mt-3 font-bold"><i class="fas fa-hand-pointer mr-1"></i> Sentuh titik nama untuk Edit, Hapus, atau Tambah Cabang.</p>
        </section>

        <!-- KANVAS PETA LEAFLET -->
        <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 class="text-sm font-bold text-slate-800"><i class="fas fa-map-pin text-amber-600 mr-1.5"></i> Radar Peta Desa</h2>
            </div>
            <div id="map" class="w-full h-[250px] rounded-2xl border border-slate-200 shadow-inner bg-slate-50"></div>
        </section>
    </main>

    <!-- ========================================== -->
    <!-- MODAL FORM TAMBAH DATA WARGA               -->
    <!-- ========================================== -->
    <div id="modal-tambah" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex-col justify-center items-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button id="btn-close-modal" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fas fa-user-plus text-emerald-600 mr-2"></i>Tambah Individu</h3>
            
            <form id="form-tambah" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-600">Nama Lengkap</label>
                    <input type="text" id="input-nama" required placeholder="Contoh: Anong Sutarno" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Jenis Kelamin</label>
                    <select id="select-gender" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="L">Laki-laki (Ayah/Suami/Anak Laki)</option>
                        <option value="P">Perempuan (Ibu/Istri/Anak Perempuan)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Orang Tua Kandung (Jalur Silsilah ke Atas)</label>
                    <select id="select-parent" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="">-- Pilih Orang Tua --</option>
                        <option value="akar_utama">🌟 JADIKAN LELUHUR UTAMA (GARIS BARU) 🌟</option>
                        <option value="unknown">❓ Belum Diketahui (Bisa Diedit Nanti)</option>
                        <option value="manual">✍️ Ketik Manual (Nama Baru)</option>
                    </select>
                    <input type="text" id="input-parent-manual" placeholder="Ketik nama orang tua secara manual..." class="hidden w-full mt-2 bg-white border border-emerald-300 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-inner">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Menikah dengan Pasangan (Opsional)</label>
                    <select id="select-spouse" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="">-- Belum Menikah / Lajang --</option>
                        <option value="unknown">❓ Belum Diketahui / Misterius</option>
                        <option value="manual">✍️ Ketik Manual (Nama Baru)</option>
                    </select>
                    <input type="text" id="input-spouse-manual" placeholder="Ketik nama pasangan secara manual..." class="hidden w-full mt-2 bg-white border border-emerald-300 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-inner">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm hover:bg-emerald-700 transition-colors shadow-md mt-2">
                    Simpan Individu
                </button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL KELOLA (EDIT/HAPUS/TAMBAH ANAK)      -->
    <!-- ========================================== -->
    <div id="modal-edit" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[110] hidden flex-col justify-center items-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl relative border-t-4 border-amber-500 max-h-[90vh] overflow-y-auto">
            <button id="btn-close-edit" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fas fa-cog text-amber-500 mr-2"></i>Kelola Individu</h3>
            
            <form id="form-edit" class="space-y-4">
                <input type="hidden" id="edit-dbkey">
                <div>
                    <label class="text-xs font-bold text-slate-600">Nama Lengkap</label>
                    <input type="text" id="edit-nama" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Jenis Kelamin</label>
                    <select id="edit-gender" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="L">Laki-laki</option>
                        <option value="P">Perempuan</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Pasangan (Suami / Istri)</label>
                    <select id="edit-spouse" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="">-- Belum Menikah / Lajang --</option>
                        <option value="unknown">❓ Belum Diketahui / Misterius</option>
                        <option value="manual">✍️ Ketik Manual (Nama Baru)</option>
                    </select>
                    <input type="text" id="edit-spouse-manual" placeholder="Ketik nama pasangan manual..." class="hidden w-full mt-2 bg-white border border-amber-300 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none shadow-inner">
                </div>
                
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-amber-500 text-white font-bold py-3 rounded-xl text-xs hover:bg-amber-600 transition-colors shadow-md">
                        <i class="fas fa-save mr-1"></i> Update Data
                    </button>
                    <button type="button" id="btn-hapus-data" class="flex-none bg-red-100 text-red-600 font-bold py-3 px-4 rounded-xl text-xs hover:bg-red-200 transition-colors shadow-sm" title="Hapus Data">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </form>

            <hr class="my-4 border-slate-100">

            <button type="button" id="btn-tambah-cabang" class="w-full bg-emerald-50 text-emerald-700 font-bold py-3 rounded-xl text-xs hover:bg-emerald-100 border border-emerald-200 transition-colors shadow-sm">
                <i class="fas fa-code-branch mr-2"></i>Tambah Keturunan di Bawah Nama Ini
            </button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- D3 JS -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- SCRIPT UTAMA & FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0JmHvkhB5oXPvnDMvcHJyooqSsLIccGQ",
            authDomain: "sakaruhun-desa.firebaseapp.com",
            databaseURL: "https://sakaruhun-desa-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "sakaruhun-desa",
            storageBucket: "sakaruhun-desa.firebasestorage.app",
            messagingSenderId: "69221074382",
            appId: "1:69221074382:web:b15104ddc2618c1c70979f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const wargaRef = ref(db, 'silsilah_desa_v3');

        // Peta Leaflet
        const map = L.map('map').setView([-6.8320, 108.2140], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        let layerGroup = L.layerGroup().addTo(map);
        setTimeout(() => { map.invalidateSize(); }, 1000);

        // Kanvas D3.js
        const container = document.getElementById('tree-container');
        const svg = d3.select("#tree-container").append("svg").attr("width", container.clientWidth).attr("height", container.clientHeight);
        const g = svg.append("g");
        const zoom = d3.zoom().scaleExtent([0.5, 3]).on("zoom", (event) => { g.attr("transform", event.transform); });
        svg.call(zoom);

        // Kalkulator Otomatis Pancakaki
        function hitungPancakakiOtomatis(nodeKey, allDataMap) {
            let node = allDataMap[nodeKey];
            if (!node || !node.parentId || node.parentId === "" || node.parentId === "akar_utama") return "Karuhun Utama";
            let generationCount = 1;
            let currentParentId = node.parentId;
            while (currentParentId && allDataMap[currentParentId]) {
                generationCount++;
                currentParentId = allDataMap[currentParentId].parentId;
            }
            const kamusPancakaki = { 1: "Karuhun Utama", 2: "Bapak / Indung (Gen-2)", 3: "Aki / Nini (Gen-3)", 4: "Buyut (Cicit)", 5: "Bao", 6: "Janggawaréng", 7: "Udeg-udeg", 8: "Gantung-siwur" };
            return kamusPancakaki[generationCount] || `Keturunan Gen-${generationCount}`;
        }

        // Modal Handlers
        const modalTambah = document.getElementById('modal-tambah');
        const formTambah = document.getElementById('form-tambah');
        const selectParent = document.getElementById('select-parent');
        const inputParentManual = document.getElementById('input-parent-manual');
        const selectSpouse = document.getElementById('select-spouse');
        const inputSpouseManual = document.getElementById('input-spouse-manual');
        
        document.getElementById('btn-tambah-data').addEventListener('click', () => { modalTambah.classList.remove('hidden'); modalTambah.classList.add('flex'); });
        document.getElementById('btn-close-modal').addEventListener('click', () => { modalTambah.classList.add('hidden'); modalTambah.classList.remove('flex'); });

        const modalEdit = document.getElementById('modal-edit');
        const formEdit = document.getElementById('form-edit');
        const editGender = document.getElementById('edit-gender');
        const editSpouse = document.getElementById('edit-spouse');
        const editSpouseManual = document.getElementById('edit-spouse-manual');
        document.getElementById('btn-close-edit').addEventListener('click', () => { modalEdit.classList.add('hidden'); modalEdit.classList.remove('flex'); });

        // Logika Tampil/Sembunyikan Input Manual
        selectParent.addEventListener('change', (e) => {
            if (e.target.value === 'manual') {
                inputParentManual.classList.remove('hidden');
                inputParentManual.setAttribute('required', 'true');
            } else {
                inputParentManual.classList.add('hidden');
                inputParentManual.removeAttribute('required');
            }
        });

        selectSpouse.addEventListener('change', (e) => {
            if (e.target.value === 'manual') {
                inputSpouseManual.classList.remove('hidden');
                inputSpouseManual.setAttribute('required', 'true');
            } else {
                inputSpouseManual.classList.add('hidden');
                inputSpouseManual.removeAttribute('required');
            }
        });

        editSpouse.addEventListener('change', (e) => {
            if (e.target.value === 'manual') {
                editSpouseManual.classList.remove('hidden');
                editSpouseManual.setAttribute('required', 'true');
            } else {
                editSpouseManual.classList.add('hidden');
                editSpouseManual.removeAttribute('required');
            }
        });

        document.getElementById('btn-hapus-data').addEventListener('click', () => {
            const dbKey = document.getElementById('edit-dbkey').value;
            if (dbKey === 'akar_utama') { alert("Karuhun Utama tidak dapat dihapus!"); return; }
            if (confirm("Yakin ingin menghapus data ini? Keturunannya otomatis terhubung ke karuhun utama.")) {
                remove(ref(db, 'silsilah_desa_v3/' + dbKey)).then(() => { modalEdit.classList.add('hidden'); modalEdit.classList.remove('flex'); });
            }
        });

        document.getElementById('btn-tambah-cabang').addEventListener('click', () => {
            const dbKey = document.getElementById('edit-dbkey').value;
            modalEdit.classList.add('hidden'); modalEdit.classList.remove('flex');
            modalTambah.classList.remove('hidden'); modalTambah.classList.add('flex');
            selectParent.value = dbKey;
            document.getElementById('input-nama').focus();
        });

        // Realtime Data Sync
        let dataGlobal = [];
        onValue(wargaRef, (snapshot) => {
            if (!snapshot.exists()) {
                set(ref(db, 'silsilah_desa_v3/akar_utama'), { parentId: "", name: "Jayamanggala", gender: "L", spouseId: "", lat: -6.8320, lng: 108.2140 });
                return;
            }

            const rawData = snapshot.val();
            let dataMap = {};
            Object.keys(rawData).forEach(key => { dataMap[key] = { dbKey: key, ...rawData[key] }; });

            dataGlobal = Object.keys(dataMap).map(key => {
                let item = dataMap[key];
                let statusOtomatis = (key === "akar_utama") ? "Karuhun Utama" : hitungPancakakiOtomatis(key, dataMap);
                return { ...item, status: statusOtomatis };
            });

            document.getElementById('stats-warga').innerText = `${dataGlobal.length} Warga`;

            // Populate Dropdowns
            let optionsHTML = '';
            dataGlobal.forEach(w => {
                optionsHTML += `<option value="${w.dbKey}">${w.name} (${w.gender === 'L' ? 'Laki-laki' : 'Perempuan'})</option>`;
            });

            selectParent.innerHTML = `
                <option value="">-- Pilih Orang Tua --</option>
                <option value="akar_utama">🌟 JADIKAN LELUHUR UTAMA (GARIS BARU) 🌟</option>
                <option value="unknown">❓ Belum Diketahui (Bisa Diedit Nanti)</option>
                <option value="manual">✍️ Ketik Manual (Nama Baru)</option>
            ` + optionsHTML;

            const spouseOptionsHTML = `
                <option value="">-- Belum Menikah / Lajang --</option>
                <option value="unknown">❓ Belum Diketahui / Misterius</option>
                <option value="manual">✍️ Ketik Manual (Nama Baru)</option>
            ` + optionsHTML;

            selectSpouse.innerHTML = spouseOptionsHTML;
            editSpouse.innerHTML = spouseOptionsHTML;

            layerGroup.clearLayers();
            dataGlobal.forEach(w => {
                if (w.lat && w.lng) {
                    L.marker([w.lat, w.lng]).addTo(layerGroup).bindPopup(`<b>${w.name}</b> (${w.gender})<br><span style="font-size:10px">${w.status}</span>`);
                }
            });

            // 🌳 RENDER D3.JS VERTIKAL (Individu Mandiri + Garis Pasangan Putus-Putus)
            g.selectAll("*").remove(); 
            try {
                const root = d3.stratify().id(d => d.dbKey).parentId(d => d.parentId)(dataGlobal);
                
                const treeLayout = d3.tree().nodeSize([220, 150]); 
                treeLayout(root);
                
                // Render Garis Keturunan Utama (Vertikal)
                g.selectAll(".link").data(root.links()).enter().append("path").attr("class", "link")
                    .attr("d", d3.linkVertical().x(d => d.x).y(d => d.y));

                let nodeMap = {};
                root.descendants().forEach(d => { nodeMap[d.data.dbKey] = d; });

                // Render Garis Pasangan (Dashed Line)
                let spouseLinks = [];
                root.descendants().forEach(d => {
                    if (d.data.spouseId && nodeMap[d.data.spouseId]) {
                        let targetNode = nodeMap[d.data.spouseId];
                        if (d.data.dbKey < targetNode.data.dbKey) {
                            spouseLinks.push({ source: d, target: targetNode });
                        }
                    }
                });

                g.selectAll(".spouse-link")
                    .data(spouseLinks)
                    .enter().append("path")
                    .attr("class", "spouse-link")
                    .attr("d", d => {
                        let x1 = d.source.x, y1 = d.source.y;
                        let x2 = d.target.x, y2 = d.target.y;
                        return `M ${x1} ${y1} Q ${(x1+x2)/2} ${Math.min(y1,y2) - 15} ${x2} ${y2}`;
                    });

                // Render Node Individu
                const node = g.selectAll(".node").data(root.descendants()).enter().append("g")
                    .attr("class", d => `node ${d.data.gender === 'L' ? 'laki' : 'perempuan'}`)
                    .attr("transform", d => `translate(${d.x},${d.y})`)
                    .on("click", (event, d) => {
                        document.getElementById('edit-dbkey').value = d.data.dbKey;
                        document.getElementById('edit-nama').value = d.data.name;
                        editGender.value = d.data.gender || 'L';
                        
                        if (d.data.spouseId && dataMap[d.data.spouseId]) {
                            editSpouse.value = d.data.spouseId;
                            editSpouseManual.classList.add('hidden');
                        } else {
                            editSpouse.value = "";
                            editSpouseManual.classList.add('hidden');
                        }

                        modalEdit.classList.remove('hidden');
                        modalEdit.classList.add('flex');
                    });

                node.append("circle").attr("r", 16).attr("fill", "transparent").attr("stroke", "transparent"); 
                node.append("circle").attr("r", 8).style("pointer-events", "none");
                
                // Teks Nama Individu
                node.append("text")
                    .attr("dy", -28)
                    .attr("x", 0)
                    .style("text-anchor", "middle")
                    .each(function(d) {
                        let teksLengkap = d.data.name;
                        let el = d3.select(this);
                        
                        if (teksLengkap.length > 16) {
                            let tengah = Math.floor(teksLengkap.length / 2);
                            let spasiIdx = teksLengkap.indexOf(' ', tengah);
                            if (spasiIdx === -1) spasiIdx = tengah;
                            
                            let baris1 = teksLengkap.substring(0, spasiIdx);
                            let baris2 = teksLengkap.substring(spasiIdx + 1);
                            
                            el.text("");
                            el.append("tspan").attr("x", 0).attr("dy", "-1.2em").text(baris1);
                            el.append("tspan").attr("x", 0).attr("dy", "1.1em").text(baris2);
                        } else {
                            el.text(teksLengkap);
                        }
                    });
                
                // Teks Status Pancakaki
                node.append("text")
                    .attr("class", "status")
                    .attr("dy", 26)
                    .attr("x", 0)
                    .style("text-anchor", "middle")
                    .text(d => d.data.status);
                
                svg.call(zoom.transform, d3.zoomIdentity.translate(container.clientWidth / 2, 60));
            } catch (error) {
                console.log("Menyesuaikan struktur silsilah...", error);
            }
        });

        // Form Submit Tambah (Dengan dukungan parent & spouse manual)
        formTambah.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = document.getElementById('input-nama').value;
            const gender = document.getElementById('select-gender').value;
            
            let parentId = selectParent.value;
            if (parentId === 'unknown') {
                parentId = 'akar_utama'; // atau node placeholder "Belum Diketahui"
            } else if (parentId === 'manual') {
                const manualParentName = inputParentManual.value;
                if (manualParentName) {
                    const newParentRef = push(wargaRef, {
                        parentId: 'akar_utama',
                        name: manualParentName,
                        gender: gender === 'L' ? 'P' : 'L', // Perkiraan gender lawan atau netral
                        spouseId: '',
                        lat: -6.8320 + (Math.random() - 0.5) * 0.005,
                        lng: 108.2140 + (Math.random() - 0.5) * 0.005
                    });
                    parentId = newParentRef.key;
                }
            }

            let spouseId = selectSpouse.value;
            if (spouseId === 'unknown') {
                // Buat node pasangan belum diketahui jika perlu, atau kosongkan
                spouseId = '';
            } else if (spouseId === 'manual') {
                const manualSpouseName = inputSpouseManual.value;
                if (manualSpouseName) {
                    const newSpouseRef = push(wargaRef, {
                        parentId: 'akar_utama',
                        name: manualSpouseName,
                        gender: gender === 'L' ? 'P' : 'L',
                        spouseId: '',
                        lat: -6.8320 + (Math.random() - 0.5) * 0.005,
                        lng: 108.2140 + (Math.random() - 0.5) * 0.005
                    });
                    spouseId = newSpouseRef.key;
                }
            }

            // Simpan Data Utama
            const newWargaRef = push(wargaRef, {
                parentId: parentId || 'akar_utama', 
                name: nama, 
                gender: gender,
                spouseId: spouseId || '',
                lat: -6.8320 + (Math.random() - 0.5) * 0.005, 
                lng: 108.2140 + (Math.random() - 0.5) * 0.005
            });

            // Jika ada pasangan, update balik pasangan tersebut agar saling terhubung (Two-way spouse link)
            if (spouseId && spouseId !== 'unknown') {
                update(ref(db, 'silsilah_desa_v3/' + spouseId), {
                    spouseId: newWargaRef.key
                });
            }

            modalTambah.classList.add('hidden'); modalTambah.classList.remove('flex');
            formTambah.reset();
            inputParentManual.classList.add('hidden');
            inputSpouseManual.classList.add('hidden');
        });

        // Form Submit Edit
        formEdit.addEventListener('submit', async (e) => {
            e.preventDefault();
            const dbKey = document.getElementById('edit-dbkey').value;
            const namaBaru = document.getElementById('edit-nama').value;
            const genderBaru = editGender.value;
            
            let spouseBaru = editSpouse.value;
            if (spouseBaru === 'manual') {
                const manualSpouseName = editSpouseManual.value;
                if (manualSpouseName) {
                    const newSpouseRef = push(wargaRef, {
                        parentId: 'akar_utama',
                        name: manualSpouseName,
                        gender: genderBaru === 'L' ? 'P' : 'L',
                        spouseId: dbKey,
                        lat: -6.8320 + (Math.random() - 0.5) * 0.005,
                        lng: 108.2140 + (Math.random() - 0.5) * 0.005
                    });
                    spouseBaru = newSpouseRef.key;
                }
            }

            update(ref(db, 'silsilah_desa_v3/' + dbKey), { 
                name: namaBaru, 
                gender: genderBaru,
                spouseId: spouseBaru === 'unknown' ? '' : spouseBaru 
            }).then(() => {
                modalEdit.classList.add('hidden'); modalEdit.classList.remove('flex');
                editSpouseManual.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
