function showModal(el){el.classList.add("open")}
function hideModal(el){el.classList.remove("open")}
function notify(msg){alert(msg)}
function escapeHtml(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function randomCoords(){
 return {
  lat:-6.832+(Math.random()-.5)*.005,
  lng:108.214+(Math.random()-.5)*.005
 };
}
function syncManual(sel,input){
 const active=sel.value==="manual";
 input.classList.toggle("hidden",!active);
 input.required=active;
 if(!active)input.value="";
}

function fillSelect(sel,kind,selected=""){
 const isParent=kind==="parent";
 const options=isParent
  ? '<option value="akar_utama">Jadikan leluhur utama / garis baru</option><option value="unknown">Belum diketahui</option><option value="manual">Ketik nama baru</option>'
  : '<option value="">Belum menikah / lajang</option><option value="unknown">Belum diketahui</option><option value="manual">Ketik nama baru</option>';

 const currentKey=$("edit-dbkey").value;
 const people=dataGlobal
  .filter(p=>p.dbKey!==currentKey || sel.id==="select-parent")
  .map(p=>`<option value="${escapeHtml(p.dbKey)}">${escapeHtml(p.name)} (${p.gender==="L"?"L":"P"})</option>`)
  .join("");

 sel.innerHTML=options+people;
 if(selected && [...sel.options].some(o=>o.value===selected)){
  sel.value=selected;
 }else{
  sel.value=isParent?"akar_utama":"";
 }
}

function normalizeData(raw){
 const result={};
 Object.entries(raw||{}).forEach(([key,v])=>{
  if(!v||typeof v!=="object")return;
  result[key]={
   dbKey:key,
   name:String(v.name||"Tanpa Nama"),
   gender:v.gender==="P"?"P":"L",
   parentId:v.parentId||"",
   spouseId:v.spouseId||"",
   lat:Number(v.lat),
   lng:Number(v.lng)
  };
 });

 if(!result.akar_utama){
  result.akar_utama={
   dbKey:"akar_utama",
   name:"Pangeran Kertadiningrat",
   gender:"L",
   parentId:"",
   spouseId:"",
   lat:-6.832,
   lng:108.214
  };
 }

 Object.values(result).forEach(p=>{
  if(p.dbKey==="akar_utama"){p.parentId="";return}
  if(!p.parentId || p.parentId==="unknown" ||
     !result[p.parentId] || p.parentId===p.dbKey){
   p.parentId="akar_utama";
  }
 });

 return result;
}

function statusFor(key){
 if(key==="akar_utama")return "Karuhun Utama";
 let p=dataMap[key],depth=1,seen=new Set([key]);
 while(p&&p.parentId&&p.parentId!=="akar_utama"&&
       dataMap[p.parentId]&&!seen.has(p.parentId)){
  seen.add(p.parentId);
  depth++;
  p=dataMap[p.parentId];
 }
 return `Keturunan Gen-${depth}`;
}

function initMap(){
 if(!window.L||map)return;
 map=L.map("map").setView([-6.832,108.214],15);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,attribution:"&copy; OpenStreetMap"
 }).addTo(map);
 layerGroup=L.layerGroup().addTo(map);
 setTimeout(()=>map.invalidateSize(),400);
}

function drawMap(){
 if(!map||!layerGroup)return;
 layerGroup.clearLayers();
 dataGlobal.forEach(p=>{
  if(Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&
     Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180){
   L.marker([p.lat,p.lng]).addTo(layerGroup)
    .bindPopup(`<b>${escapeHtml(p.name)}</b><br>${p.gender==="L"?"Laki-laki":"Perempuan"}`);
  }
 });
}

/*
 * STRUKTUR POHON:
 * 1. Pangeran Kertadiningrat berada di node utama.
 * 2. Nyimas Lampeg sebagai istri berada di sampingnya pada Y yang sama.
 * 3. Istri tambahan ditempatkan di kolom pasangan yang sama, berurutan vertikal.
 * 4. Pasangan tidak dijadikan anak dalam d3.stratify().
 * 5. Anak tetap berada di generasi bawah orang tua.
 */
function renderTree(){
 if(!window.d3)return;

 const container=$("tree-container");
 const width=Math.max(container.clientWidth,320);
 const height=Math.max(container.clientHeight,300);

 const svg=d3.select(container).selectAll("svg")
  .data([null]).join("svg")
  .attr("width","100%")
  .attr("height","100%")
  .attr("viewBox",`0 0 ${width} ${height}`);

 svg.selectAll("*").remove();

 const g=svg.append("g");
 zoomBehavior=d3.zoom().scaleExtent([.15,2.5])
  .on("zoom",e=>g.attr("transform",e.transform));

 svg.call(zoomBehavior).on("dblclick.zoom",null);

 try{
  const all=dataGlobal.map(p=>({...p}));
  const byId=new Map(all.map(p=>[p.dbKey,p]));

  // Bangun relasi pasangan dua arah, walaupun hanya satu pihak
  // yang menyimpan spouseId di Firebase.
  const spouseOf=new Map();
  function linkSpouse(a,b){
   if(!a||!b||a===b||!byId.has(a)||!byId.has(b))return;
   if(!spouseOf.has(a))spouseOf.set(a,[]);
   if(!spouseOf.has(b))spouseOf.set(b,[]);
   if(!spouseOf.get(a).includes(b))spouseOf.get(a).push(b);
   if(!spouseOf.get(b).includes(a))spouseOf.get(b).push(a);
  }
  all.forEach(p=>linkSpouse(p.dbKey,p.spouseId));

  // Pasangan tidak menjadi node anak dalam hierarki.
  // Leluhur utama tetap menjadi root.
  const spouseIds=new Set();
  spouseOf.forEach(ids=>ids.forEach(id=>spouseIds.add(id)));
  const primary=all.filter(p=>
   p.dbKey==="akar_utama"||!spouseIds.has(p.dbKey)
  );

  const primaryIds=new Set(primary.map(p=>p.dbKey));

  // Jika anak terhubung melalui orang tua yang merupakan pasangan,
  // alihkan jalur visual ke pasangannya yang ada di hierarki.
  const records=primary.map(p=>{
   let parent=p.dbKey==="akar_utama"?null:p.parentId;
   if(parent&&!primaryIds.has(parent)){
    const alternatives=spouseOf.get(parent)||[];
    parent=alternatives.find(id=>primaryIds.has(id))||"akar_utama";
   }
   if(p.dbKey!=="akar_utama"&&
      (!parent||!primaryIds.has(parent)||parent===p.dbKey)){
    parent="akar_utama";
   }
   return {...p,parentId:parent};
  });

  const root=d3.stratify()
   .id(d=>d.dbKey)
   .parentId(d=>d.parentId)(records);

  d3.tree().nodeSize([210,155])(root);

  const nodes=root.descendants();
  const links=root.links();

  // Link keturunan saja.
  g.selectAll(".link").data(links).join("path")
   .attr("class","link")
   .attr("d",d=>
    `M${d.source.x},${d.source.y}
     V${(d.source.y+d.target.y)/2}
     H${d.target.x} V${d.target.y}`
   );

  // Susun posisi pasangan berdasarkan node pasangannya.
  // Istri pertama sejajar tepat dengan suami.
  // Jika ada istri kedua/ketiga, posisi vertikal dibedakan.
  const spousePositions=[];
  const renderedPairs=new Set();

  nodes.forEach(n=>{
   const ids=spouseOf.get(n.data.dbKey)||[];
   if(!ids.length)return;

   const spouses=ids.filter(id=>byId.has(id));
   const owner=n.data.dbKey;

   spouses.forEach((id,index)=>{
    const pairKey=[owner,id].sort().join("::");
    if(renderedPairs.has(pairKey))return;
    renderedPairs.add(pairKey);

    const person=byId.get(id);
    const offset=(index-(spouses.length-1)/2)*48;

    spousePositions.push({
     person,
     source:n,
     x:n.x+125,
     y:n.y+offset
    });
   });
  });

  g.selectAll(".spouse-link")
   .data(spousePositions).join("path")
   .attr("class","spouse-link")
   .attr("d",d=>
    `M${d.source.x+17},${d.source.y} L${d.x-17},${d.y}`
   );

  const drawNodes=nodes.map(n=>({
   data:{...n.data,status:statusFor(n.data.dbKey)},
   x:n.x,y:n.y,primary:true
  }));

  spousePositions.forEach(s=>{
   drawNodes.push({
    data:{...s.person,status:"Pasangan"},
    x:s.x,y:s.y,primary:false
   });
  });

  nodeSelection=g.selectAll(".node")
   .data(drawNodes).join("g")
   .attr("class",d=>"node "+(d.data.gender==="P"?"perempuan":"laki"))
   .attr("transform",d=>`translate(${d.x},${d.y})`)
   .on("click",(event,d)=>{
    event.stopPropagation();
    openEdit(d.data);
   });

  nodeSelection.append("circle").attr("r",16);

  nodeSelection.append("text")
   .attr("dy",-25).attr("text-anchor","middle")
   .text(d=>d.data.name.length>28
    ?d.data.name.slice(0,26)+"…":d.data.name);

  nodeSelection.append("text")
   .attr("class","status")
   .attr("dy",29).attr("text-anchor","middle")
   .text(d=>d.data.status);

  const extent=d3.extent(drawNodes,d=>d.x);
  const extentY=d3.extent(drawNodes,d=>d.y);
  const cx=(extent[0]+extent[1])/2;
  const cy=(extentY[0]+extentY[1])/2;

  svg.call(zoomBehavior.transform,
   d3.zoomIdentity.translate(width/2-cx,height/2-cy)
  );

  treeReady=true;
 }catch(err){
  console.error("Gagal merender pohon:",err);
  container.insertAdjacentHTML("beforeend",
   '<p style="position:absolute;bottom:5px;background:#fef3c7;padding:8px;font-size:11px">Gagal menggambar pohon. Periksa Console browser.</p>'
  );
 }
}

function openEdit(person){
 $("edit-dbkey").value=person.dbKey;
 $("edit-nama").value=person.name;
 $("edit-gender").value=person.gender;
 fillSelect($("edit-parent"),"parent",person.parentId||"akar_utama");
 fillSelect($("edit-spouse"),"spouse",person.spouseId||"");
 syncManual($("edit-parent"),$("edit-parent-manual"));
 syncManual($("edit-spouse"),$("edit-spouse-manual"));
 showModal(modalEdit);
}
    function refreshSearch(){
 const q=$("input-pencarian").value.trim().toLocaleLowerCase("id");
 if(!nodeSelection)return;

 nodeSelection.select("circle")
  .attr("stroke",d=>q&&d.data.name.toLocaleLowerCase("id").includes(q)?"#f59e0b":"#fff")
  .attr("stroke-width",d=>q&&d.data.name.toLocaleLowerCase("id").includes(q)?5:2);

 if(!q)return;

 const match=drawSearchMatch(q);
 if(match){
  const container=$("tree-container");
  const w=container.clientWidth,h=container.clientHeight;
  d3.select(container).select("svg").transition().duration(300)
   .call(zoomBehavior.transform,
    d3.zoomIdentity.translate(w/2-match.x,h/2-match.y)
   );
 }
}

function drawSearchMatch(q){
 let result=null;
 nodeSelection.each(d=>{
  if(!result&&d.data.name.toLocaleLowerCase("id").includes(q))result=d;
 });
 return result;
}

async function resolvePerson(value,input,gender,parentDefault="akar_utama"){
 if(value==="manual"){
  const name=input.value.trim();
  if(!name)throw new Error("Nama baru wajib diisi.");

  const newRef=push(wargaRef);
  await set(newRef,{
   name,
   gender:gender==="L"?"P":"L",
   parentId:parentDefault,
   spouseId:"",
   ...randomCoords()
  });
  return newRef.key;
 }
 if(value==="unknown")return "";
 return value||"";
}

async function saveNew(e){
 e.preventDefault();
 const button=formTambah.querySelector('button[type="submit"]');
 button.disabled=true;

 try{
  const name=$("input-nama").value.trim();
  const gender=$("select-gender").value;
  if(!name)throw new Error("Nama wajib diisi.");

  let parentId=$("select-parent").value;
  if(parentId==="manual"){
   parentId=await resolvePerson(parentId,$("input-parent-manual"),gender);
  }
  if(parentId==="unknown"||!parentId)parentId="akar_utama";

  let spouseId=$("select-spouse").value;
  if(spouseId==="manual"){
   spouseId=await resolvePerson(spouseId,$("input-spouse-manual"),gender);
  }
  if(spouseId==="unknown")spouseId="";

  const newRef=push(wargaRef);
  await set(newRef,{
   name,gender,parentId,spouseId:spouseId||"",...randomCoords()
  });

  if(spouseId&&dataMap[spouseId]){
   await update(ref(db,`${DB_PATH}/${spouseId}`),{spouseId:newRef.key});
  }

  hideModal(modalTambah);
  formTambah.reset();
  syncManual($("select-parent"),$("input-parent-manual"));
  syncManual($("select-spouse"),$("input-spouse-manual"));
 }catch(err){
  console.error(err);
  notify("Gagal menyimpan: "+err.message);
 }finally{
  button.disabled=false;
 }
}

async function saveEdit(e){
 e.preventDefault();
 const button=formEdit.querySelector('button[type="submit"]');
 button.disabled=true;

 try{
  const key=$("edit-dbkey").value;
  const name=$("edit-nama").value.trim();
  const gender=$("edit-gender").value;

  if(!key||!name)throw new Error("Nama wajib diisi.");

  let parentId=$("edit-parent").value;
  if(parentId==="manual"){
   parentId=await resolvePerson(parentId,$("edit-parent-manual"),gender);
  }
  if(parentId==="unknown"||!parentId)parentId="akar_utama";
  if(parentId===key)throw new Error("Orang tua tidak boleh dirinya sendiri.");

  let spouseId=$("edit-spouse").value;
  if(spouseId==="manual"){
   spouseId=await resolvePerson(spouseId,$("edit-spouse-manual"),gender);
  }
  if(spouseId==="unknown")spouseId="";
  if(spouseId===key)throw new Error("Tidak dapat menikah dengan diri sendiri.");

  const old=dataMap[key];

  await update(ref(db,`${DB_PATH}/${key}`),{
   name,gender,parentId,spouseId:spouseId||""
  });

  if(old?.spouseId&&old.spouseId!==spouseId&&dataMap[old.spouseId]){
   await update(ref(db,`${DB_PATH}/${old.spouseId}`),{spouseId:""});
  }

  if(spouseId&&dataMap[spouseId]){
   await update(ref(db,`${DB_PATH}/${spouseId}`),{spouseId:key});
  }

  hideModal(modalEdit);
 }catch(err){
  console.error(err);
  notify("Gagal memperbarui: "+err.message);
 }finally{
  button.disabled=false;
 }
}

async function deletePerson(){
 const key=$("edit-dbkey").value;
 if(!key)return;

 if(key==="akar_utama"){
  notify("Leluhur utama tidak dapat dihapus.");
  return;
 }

 if(!confirm("Hapus individu ini? Anak-anak akan dipindahkan ke leluhur utama."))return;

 try{
  const updates={};
  dataGlobal.filter(p=>p.parentId===key).forEach(p=>{
   updates[`${DB_PATH}/${p.dbKey}/parentId`]="akar_utama";
  });

  const person=dataMap[key];
  if(person?.spouseId&&dataMap[person.spouseId]){
   updates[`${DB_PATH}/${person.spouseId}/spouseId`]="";
  }

  if(Object.keys(updates).length)await update(ref(db),updates);
  await remove(ref(db,`${DB_PATH}/${key}`));
  hideModal(modalEdit);
 }catch(err){
  console.error(err);
  notify("Gagal menghapus: "+err.message);
 }
}

function wireEvents(){
 $("btn-tambah-data").addEventListener("click",()=>{
  formTambah.reset();
  fillSelect($("select-parent"),"parent","akar_utama");
  fillSelect($("select-spouse"),"spouse","");
  syncManual($("select-parent"),$("input-parent-manual"));
  syncManual($("select-spouse"),$("input-spouse-manual"));
  showModal(modalTambah);
 });

 $("btn-lihat-pohon").addEventListener("click",()=>{
  $("tree-container").scrollIntoView({behavior:"smooth",block:"center"});
  if(treeReady)renderTree();
 });

 $("btn-close-modal").addEventListener("click",()=>hideModal(modalTambah));
 $("btn-close-edit").addEventListener("click",()=>hideModal(modalEdit));

 modalTambah.addEventListener("click",e=>{
  if(e.target===modalTambah)hideModal(modalTambah);
 });
 modalEdit.addEventListener("click",e=>{
  if(e.target===modalEdit)hideModal(modalEdit);
 });

 $("select-parent").addEventListener("change",()=>syncManual($("select-parent"),$("input-parent-manual")));
 $("select-spouse").addEventListener("change",()=>syncManual($("select-spouse"),$("input-spouse-manual")));
 $("edit-parent").addEventListener("change",()=>syncManual($("edit-parent"),$("edit-parent-manual")));
 $("edit-spouse").addEventListener("change",()=>syncManual($("edit-spouse"),$("edit-spouse-manual")));

 formTambah.addEventListener("submit",saveNew);
 formEdit.addEventListener("submit",saveEdit);
 $("btn-hapus-data").addEventListener("click",deletePerson);

 $("btn-tambah-cabang").addEventListener("click",()=>{
  const key=$("edit-dbkey").value;
  hideModal(modalEdit);
  formTambah.reset();
  fillSelect($("select-parent"),"parent",key);
  fillSelect($("select-spouse"),"spouse","");
  syncManual($("select-parent"),$("input-parent-manual"));
  syncManual($("select-spouse"),$("input-spouse-manual"));
  showModal(modalTambah);
  $("input-nama").focus();
 });

 $("input-pencarian").addEventListener("input",refreshSearch);

 window.addEventListener("resize",()=>{
  if(treeReady)renderTree();
  if(map)setTimeout(()=>map.invalidateSize(),100);
 });

 document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
   hideModal(modalTambah);
   hideModal(modalEdit);
  }
 });
}

function startFirebase(){
 try{
  const app=initializeApp(firebaseConfig);
  db=getDatabase(app);
  wargaRef=ref(db,DB_PATH);

  onValue(wargaRef,async snapshot=>{
   try{
    if(!snapshot.exists()){
     await set(ref(db,`${DB_PATH}/akar_utama`),{
      name:"Pangeran Kertadiningrat",
      gender:"L",
      parentId:"",
      spouseId:"",
      lat:-6.832,
      lng:108.214
     });
     return;
    }

    dataMap=normalizeData(snapshot.val());
    dataGlobal=Object.values(dataMap).map(p=>({
     ...p,status:statusFor(p.dbKey)
    }));

    $("stats-warga").textContent=`${dataGlobal.length} Warga`;

    fillSelect($("select-parent"),"parent",$("select-parent").value);
    fillSelect($("select-spouse"),"spouse",$("select-spouse").value);

    if(!$("edit-dbkey").value){
     fillSelect($("edit-parent"),"parent");
     fillSelect($("edit-spouse"),"spouse");
    }

    renderTree();
    drawMap();
    refreshSearch();
   }catch(err){
    console.error("Gagal memproses Firebase:",err);
    notify("Data terbaca tetapi gagal ditampilkan: "+err.message);
   }
  },err=>{
   console.error("Firebase read error:",err);
   notify("Gagal membaca Firebase: "+err.message);
  });
 }catch(err){
  console.error(err);
  notify("Firebase gagal diinisialisasi: "+err.message);
 }
}

wireEvents();
try{initMap()}catch(err){console.error("Peta gagal dimuat:",err)}
startFirebase();
</script>
