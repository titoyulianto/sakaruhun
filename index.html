<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sakaruhun - Sadulur Sadesa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        .bg-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- HEADER & PENCARIAN -->
    <header class="bg-emerald-700 w-full rounded-b-[2.5rem] shadow-lg relative pt-10 pb-16 px-5 bg-pattern">
        <div class="max-w-md mx-auto relative z-10 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl text-white mb-3">
                <i class="fas fa-leaf text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight mb-1">Bale Karuhun</h1>
            <p class="text-emerald-100 text-xs tracking-wide">Jaringan Silsilah & Kekerabatan Desa</p>
            
            <div class="mt-6 relative">
                <input type="text" placeholder="Cari nama dulur atau karuhun..." class="w-full bg-white py-3.5 pl-12 pr-5 rounded-2xl text-sm font-semibold text-slate-700 shadow-[0_8px_30px_rgb(0,0,0,0.12)] focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all">
                <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
            </div>
            <div class="mt-3 text-[10px] text-emerald-200">
                <i class="fas fa-users mr-1"></i> Terhubung: <strong id="stats-warga">0 Warga</strong>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-md mx-auto px-5 -mt-6 relative z-20 space-y-5">
        
        <!-- MENU GRID FITUR UTAMA -->
        <div class="grid grid-cols-2 gap-4">
            <button class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 hover:bg-emerald-50 transition-colors">
                <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
                    <i class="fas fa-network-wired text-xl"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-700">Pohon Karuhun</span>
                    <span class="block text-[9px] text-slate-500 mt-0.5">Lihat grafis silsilah</span>
                </div>
            </button>

            <button class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 hover:bg-amber-50 transition-colors">
                <div class="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center text-amber-600">
                    <i class="fas fa-map-location-dot text-xl"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-700">Peta Lembur</span>
                    <span class="block text-[9px] text-slate-500 mt-0.5">Sebaran rumah warga</span>
                </div>
            </button>

            <button class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 hover:bg-blue-50 transition-colors">
                <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                    <i class="fas fa-arrows-split-up-and-left text-xl"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-700">Cari Jalur Dulur</span>
                    <span class="block text-[9px] text-slate-500 mt-0.5">Cek status persaudaraan</span>
                </div>
            </button>

            <button class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 hover:bg-purple-50 transition-colors">
                <div class="w-12 h-12 rounded-full bg-purple-100 flex items-center justify-center text-purple-600">
                    <i class="fas fa-user-plus text-xl"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-700">Tambah Data</span>
                    <span class="block text-[9px] text-slate-500 mt-0.5">Lengkapi garis keluarga</span>
                </div>
            </button>
        </div>

        <!-- WADAH PETA & SILSILAH NANTI -->
        <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100" id="main-canvas">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-slate-800"><i class="fas fa-history text-emerald-600 mr-1.5"></i> Aktivitas Terbaru</h2>
                <span class="text-[10px] text-emerald-600 bg-emerald-100 px-2 py-1 rounded-full font-semibold">Live</span>
            </div>
            <div class="w-full bg-slate-50 rounded-2xl border border-slate-200 p-4 flex flex-col items-center justify-center min-h-[150px] text-center">
                <i class="fas fa-code text-slate-300 text-3xl mb-2"></i>
                <p class="text-xs text-slate-400 font-medium">Area Visualisasi D3.js & Peta Leaflet akan dirender di sini pada Tahap 2.</p>
            </div>
        </section>
    </main>

    <!-- FLOATING ACTION BUTTON (Profil/Login) -->
    <button class="fixed bottom-6 right-6 w-12 h-12 bg-emerald-600 text-white rounded-full shadow-[0_8px_20px_rgba(5,150,105,0.4)] flex justify-center items-center text-lg hover:bg-emerald-700 transition-all z-50">
        <i class="fas fa-user"></i>
    </button>

</body>
</html>
