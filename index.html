<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sakaruhun - Sadulur Sadesa</title>
    
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS (Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <!-- D3.js (Visualisasi Silsilah) -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .bg-pattern { background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        .leaflet-container { z-index: 10 !important; }
        
        /* CSS Khusus untuk D3.js Nodes & Links */
        .node circle { fill: #10b981; stroke: #fff; stroke-width: 2px; transition: all 0.2s; cursor: pointer; }
        .node:hover circle { fill: #f59e0b; transform: scale(1.4); box-shadow: 0 0 10px #f59e0b; } 
        .node text { font-size: 10px; font-weight: 800; fill: #1e293b; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; pointer-events: none;}
        .node text.status { font-size: 8px; font-weight: 600; fill: #059669; pointer-events: none;}
        .link { fill: none; stroke: #cbd5e1; stroke-width: 2px; }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- HEADER -->
    <header class="bg-emerald-700 w-full rounded-b-[2.5rem] shadow-lg relative pt-10 pb-16 px-5 bg-pattern">
        <div class="max-w-md mx-auto relative z-10 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl text-white mb-3 shadow-sm">
                <i class="fas fa-tree text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight mb-1">Sakaruhun</h1>
            <p class="text-emerald-100 text-xs tracking-widest uppercase font-semibold">Sadulur Sadesa</p>
            
            <div class="mt-6 relative">
                <input type="text" placeholder="Cari dulur atau karuhun..." class="w-full bg-white py-3.5 pl-12 pr-5 rounded-2xl text-sm font-semibold text-slate-700 shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all">
                <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
            </div>
            <div class="mt-3 text-[10px] text-emerald-200">
                <i class="fas fa-users mr-1"></i> Terhubung: <strong id="stats-warga">0 Warga</strong>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-md mx-auto px-5 -mt-6 relative z-20 space-y-5">
        
        <div class="grid grid-cols-2 gap-4">
            <button class="bg-emerald-50 p-4 rounded-2xl shadow-sm border border-emerald-200 flex flex-col items-center justify-center gap-3 ring-2 ring-emerald-400 ring-offset-1">
                <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
                    <i class="fas fa-network-wired text-xl animate-pulse"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold text-slate-700">Pohon Karuhun</span>
                    <span class="block text-[9px] text-slate-500 mt-0.5">Lihat grafis silsilah</span>
                </div>
            </button>
            <button id="btn-tambah-data" class="bg-purple-600 p-4 rounded-2xl shadow-md border border-purple-500 flex flex-col items-center justify-center gap-3 hover:bg-purple-700 transition-colors active:scale-95 cursor-pointer text-white">
                <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-white">
                    <i class="fas fa-user-plus text-xl"></i>
                </div>
                <div class="text-center">
                    <span class="block text-xs font-bold">Tambah Data</span>
                    <span class="block text-[9px] text-purple-200 mt-0.5">Isi silsilah keluarga</span>
                </div>
            </button>
        </div>

        <!-- KANVAS SILSILAH D3.JS -->
        <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 class="text-sm font-bold text-slate-800"><i class="fas fa-sitemap text-emerald-600 mr-1.5"></i> Kaki-Kaki Silsilah</h2>
                <span class="text-[9px] text-emerald-700 bg-emerald-100 px-2 py-1 rounded-full font-semibold border border-emerald-200">Live</span>
            </div>
            <div id="tree-container" class="w-full h-[350px] rounded-2xl border border-slate-200 shadow-inner bg-slate-50 overflow-hidden cursor-move relative"></div>
            <p class="text-[10px] text-center text-emerald-600 mt-3 font-bold"><i class="fas fa-hand-pointer mr-1"></i> Sentuh/Klik titik nama di atas untuk Opsi.</p>
        </section>

        <!-- KANVAS PETA LEAFLET -->
        <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 class="text-sm font-bold text-slate-800"><i class="fas fa-map-pin text-amber-600 mr-1.5"></i> Radar Peta Desa</h2>
            </div>
            <div id="map" class="w-full h-[250px] rounded-2xl border border-slate-200 shadow-inner bg-slate-50"></div>
        </section>
    </main>

    <!-- ========================================== -->
    <!-- MODAL FORM TAMBAH DATA WARGA               -->
    <!-- ========================================== -->
    <div id="modal-tambah" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex-col justify-center items-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl relative">
            <button id="btn-close-modal" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fas fa-user-plus text-emerald-600 mr-2"></i>Tambah Keluarga</h3>
            
            <form id="form-tambah" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-600">Nama Lengkap</label>
                    <input type="text" id="input-nama" required placeholder="Contoh: Mang Ujang" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Status Kekerabatan (Pancakaki)</label>
                    <select id="select-status" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="">-- Pilih Status --</option>
                        <optgroup label="Keturunan (Ke Bawah)">
                            <option value="Anak">Anak (Keturunan ke-1)</option>
                            <option value="Incu">Incu (Cucu / Anak dari anak)</option>
                            <option value="Buyut">Buyut (Cicit / Anak dari incu)</option>
                            <option value="Bao">Bao (Anak dari buyut)</option>
                            <option value="Janggawaréng">Janggawaréng (Anak dari bao)</option>
                            <option value="Udeg-udeg">Udeg-udeg (Anak dari janggawaréng)</option>
                        </optgroup>
                        <optgroup label="Leluhur & Samping">
                            <option value="Bapak/Indung">Bapak / Indung (Orang Tua)</option>
                            <option value="Aki/Nini">Aki / Nini (Kakek / Nenek)</option>
                            <option value="Dulur">Dulur (Saudara Kandung / Kakak Adik)</option>
                            <option value="Dulur Sabrayna">Dulur Sabrayna (Sepupu)</option>
                            <option value="Lainnya">✍️ Lainnya (Tulis Sendiri...)</option>
                        </optgroup>
                    </select>
                    <input type="text" id="input-status-custom" placeholder="Ketik status (misal: Uwa, Mamang)" class="hidden w-full mt-2 bg-white border border-emerald-300 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all shadow-inner">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Siapa Orang Tuanya? (Induk)</label>
                    <select id="select-parent" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="">-- Pilih Orang Tua / Leluhur --</option>
                        <option value="">🌟 JADIKAN LELUHUR UTAMA (GARIS BARU) 🌟</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm hover:bg-emerald-700 transition-colors shadow-md mt-2">
                    Simpan ke Silsilah
                </button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL KELOLA (EDIT/HAPUS/TAMBAH ANAK)      -->
    <!-- ========================================== -->
    <div id="modal-edit" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[110] hidden flex-col justify-center items-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl relative border-t-4 border-amber-500">
            <button id="btn-close-edit" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fas fa-cog text-amber-500 mr-2"></i>Kelola Data Warga</h3>
            
            <form id="form-edit" class="space-y-4">
                <input type="hidden" id="edit-dbkey">
                <div>
                    <label class="text-xs font-bold text-slate-600">Nama Lengkap</label>
                    <input type="text" id="edit-nama" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">Status Kekerabatan</label>
                    <select id="edit-select-status" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="">-- Pilih Status --</option>
                        <optgroup label="Keturunan (Ke Bawah)">
                            <option value="Anak">Anak (Keturunan ke-1)</option>
                            <option value="Incu">Incu (Cucu / Anak dari anak)</option>
                            <option value="Buyut">Buyut (Cicit / Anak dari incu)</option>
                            <option value="Bao">Bao (Anak dari buyut)</option>
                            <option value="Janggawaréng">Janggawaréng (Anak dari bao)</option>
                            <option value="Udeg-udeg">Udeg-udeg (Anak dari janggawaréng)</option>
                        </optgroup>
                        <optgroup label="Leluhur & Samping">
                            <option value="Bapak/Indung">Bapak / Indung (Orang Tua)</option>
                            <option value="Aki/Nini">Aki / Nini (Kakek / Nenek)</option>
                            <option value="Dulur">Dulur (Saudara Kandung / Kakak Adik)</option>
                            <option value="Dulur Sabrayna">Dulur Sabrayna (Sepupu)</option>
                            <option value="Lainnya">✍️ Lainnya (Tulis Sendiri...)</option>
                        </optgroup>
                    </select>
                    <input type="text" id="edit-status-custom" placeholder="Ketik status spesifik..." class="hidden w-full mt-2 bg-white border border-amber-300 rounded-xl py-2.5 px-3 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all shadow-inner">
                </div>
                
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-amber-500 text-white font-bold py-3 rounded-xl text-xs hover:bg-amber-600 transition-colors shadow-md">
                        <i class="fas fa-save mr-1"></i> Update Data
                    </button>
                    <!-- TOMBOL HAPUS -->
                    <button type="button" id="btn-hapus-data" class="flex-none bg-red-100 text-red-600 font-bold py-3 px-4 rounded-xl text-xs hover:bg-red-200 transition-colors shadow-sm" title="Hapus Data">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </form>

            <hr class="my-5 border-slate-100">

            <!-- TOMBOL TAMBAH ANAK LANGSUNG -->
            <button type="button" id="btn-tambah-cabang" class="w-full bg-emerald-50 text-emerald-700 font-bold py-3 rounded-xl text-xs hover:bg-emerald-100 border border-emerald-200 transition-colors shadow-sm">
                <i class="fas fa-code-branch mr-2"></i>Tambah Cabang di Bawah Nama Ini
            </button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- D3 JS -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- SCRIPT UTAMA & FIREBASE (Versi Full) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // 🚀 TAMBAHAN: Import fungsi remove untuk hapus
        import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Konfigurasi Firebase Lu
        const firebaseConfig = {
            apiKey: "AIzaSyA0JmHvkhB5oXPvnDMvcHJyooqSsLIccGQ",
            authDomain: "sakaruhun-desa.firebaseapp.com",
            databaseURL: "https://sakaruhun-desa-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "sakaruhun-desa",
            storageBucket: "sakaruhun-desa.firebasestorage.app",
            messagingSenderId: "69221074382",
            appId: "1:69221074382:web:b15104ddc2618c1c70979f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const wargaRef = ref(db, 'silsilah_desa_v2');

        // Peta Leaflet
        const map = L.map('map').setView([-6.8320, 108.2140], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        let layerGroup = L.layerGroup().addTo(map);
        setTimeout(() => { map.invalidateSize(); }, 1000);

        // Kanvas D3.js
        const container = document.getElementById('tree-container');
        const svg = d3.select("#tree-container").append("svg").attr("width", container.clientWidth).attr("height", container.clientHeight);
        const g = svg.append("g");
        const zoom = d3.zoom().scaleExtent([0.5, 3]).on("zoom", (event) => { g.attr("transform", event.transform); });
        svg.call(zoom);

        // =====================================
        // LOGIKA MODAL TAMBAH
        // =====================================
        const modalTambah = document.getElementById('modal-tambah');
        const formTambah = document.getElementById('form-tambah');
        const selectStatus = document.getElementById('select-status');
        const inputStatusCustom = document.getElementById('input-status-custom');
        const selectParent = document.getElementById('select-parent');
        
        document.getElementById('btn-tambah-data').addEventListener('click', () => { modalTambah.classList.remove('hidden'); modalTambah.classList.add('flex'); });
        document.getElementById('btn-close-modal').addEventListener('click', () => { modalTambah.classList.add('hidden'); modalTambah.classList.remove('flex'); });
        
        selectStatus.addEventListener('change', (e) => {
            if (e.target.value === 'Lainnya') {
                inputStatusCustom.classList.remove('hidden'); inputStatusCustom.setAttribute('required', 'true');
            } else {
                inputStatusCustom.classList.add('hidden'); inputStatusCustom.removeAttribute('required');
            }
        });

        // =====================================
        // LOGIKA MODAL KELOLA (EDIT/HAPUS)
        // =====================================
        const modalEdit = document.getElementById('modal-edit');
        const formEdit = document.getElementById('form-edit');
        const editSelectStatus = document.getElementById('edit-select-status');
        const editStatusCustom = document.getElementById('edit-status-custom');

        document.getElementById('btn-close-edit').addEventListener('click', () => { modalEdit.classList.add('hidden'); modalEdit.classList.remove('flex'); });

        // Logika Dropdown di Form Edit
        editSelectStatus.addEventListener('change', (e) => {
            if (e.target.value === 'Lainnya') {
                editStatusCustom.classList.remove('hidden'); editStatusCustom.setAttribute('required', 'true');
            } else {
                editStatusCustom.classList.add('hidden'); editStatusCustom.removeAttribute('required');
            }
        });

        // 🚀 Aksi HAPUS
        document.getElementById('btn-hapus-data').addEventListener('click', () => {
            const dbKey = document.getElementById('edit-dbkey').value;
            if (dbKey === 'akar_utama') {
                alert("Wah, Leluhur Utama tidak bisa dihapus! Nanti kasihan keturunannya melayang-layang.");
                return;
            }
            if (confirm("Yakin ingin menghapus data ini? Catatan: Jika dia punya anak, anak-anaknya otomatis akan terhubung langsung ke Leluhur Utama.")) {
                remove(ref(db, 'silsilah_desa_v2/' + dbKey)).then(() => {
                    modalEdit.classList.add('hidden'); modalEdit.classList.remove('flex');
                    alert("Data berhasil dihapus dari Silsilah.");
                });
            }
        });

        // 🚀 Aksi TAMBAH CABANG (Pintasan dari pohon)
        document.getElementById('btn-tambah-cabang').addEventListener('click', () => {
            const dbKey = document.getElementById('edit-dbkey').value;
            modalEdit.classList.add('hidden'); modalEdit.classList.remove('flex'); // Tutup Edit
            
            modalTambah.classList.remove('hidden'); modalTambah.classList.add('flex'); // Buka Tambah
            selectParent.value = dbKey; // Otomatis Pilih Ortu
            document.getElementById('input-nama').focus();
        });


        // =====================================
        // TARIK DATA REALTIME & RENDER
        // =====================================
        let dataGlobal = [];
        onValue(wargaRef, (snapshot) => {
            if (!snapshot.exists()) {
                set(ref(db, 'silsilah_desa_v2/akar_utama'), { parentId: "", name: "Jayamanggala", status: "Karuhun (Gen-1)", lat: -6.8320, lng: 108.2140 });
                return;
            }

            const data = snapshot.val();
            dataGlobal = Object.keys(data).map(key => ({ dbKey: key, ...data[key] }));
            document.getElementById('stats-warga').innerText = `${dataGlobal.length} Warga`;

            // Pengaman: Jika ada anak yang orang tuanya sudah dihapus, hubungkan ke akar utama biar ga error
            const allKeys = dataGlobal.map(w => w.dbKey);
            dataGlobal.forEach(w => {
                if (w.dbKey !== "akar_utama" && w.parentId && !allKeys.includes(w.parentId)) {
                    w.parentId = "akar_utama"; // Penyelamatan data
                    w.status += " (Jalur Ortu Hilang)";
                }
            });

            // Update Dropdown Ortu
            selectParent.innerHTML = '<option value="">-- Pilih Orang Tua / Leluhur --</option><option value="">🌟 JADIKAN LELUHUR UTAMA (GARIS BARU) 🌟</option>';
            dataGlobal.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w.dbKey; opt.text = w.name;
                selectParent.appendChild(opt);
            });

            // Update Peta
            layerGroup.clearLayers();
            dataGlobal.forEach(w => {
                if (w.lat && w.lng) L.marker([w.lat, w.lng]).addTo(layerGroup).bindPopup(`<b>${w.name}</b><br><span style="font-size:10px">${w.status}</span>`);
            });

            // Update Pohon (D3.js)
            g.selectAll("*").remove(); 
            try {
                const root = d3.stratify().id(d => d.dbKey).parentId(d => d.parentId)(dataGlobal);
                const treeLayout = d3.tree().nodeSize([40, 140]); 
                treeLayout(root);
                
                g.selectAll(".link").data(root.links()).enter().append("path").attr("class", "link")
                    .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

                const node = g.selectAll(".node").data(root.descendants()).enter().append("g")
                    .attr("class", "node")
                    .attr("transform", d => `translate(${d.y},${d.x})`)
                    .on("click", (event, d) => {
                        // BUKA MODAL KELOLA SAAT NODE DIKLIK
                        document.getElementById('edit-dbkey').value = d.data.dbKey;
                        document.getElementById('edit-nama').value = d.data.name;
                        
                        // Cek apakah statusnya ada di opsi dropdown
                        const listOpsi = Array.from(editSelectStatus.options).map(opt => opt.value);
                        if(listOpsi.includes(d.data.status)) {
                            editSelectStatus.value = d.data.status;
                            editStatusCustom.classList.add('hidden');
                        } else {
                            editSelectStatus.value = 'Lainnya';
                            editStatusCustom.value = d.data.status;
                            editStatusCustom.classList.remove('hidden');
                        }
                        
                        modalEdit.classList.remove('hidden');
                        modalEdit.classList.add('flex');
                    });

                // Area Klik Lingkaran Diperbesar
                node.append("circle").attr("r", 12).attr("fill", "transparent").attr("stroke", "transparent"); 
                node.append("circle").attr("r", 7).style("pointer-events", "none");
                node.append("text").attr("dy", -12).attr("x", 0).style("text-anchor", "middle").text(d => d.data.name);
                node.append("text").attr("class", "status").attr("dy", 18).attr("x", 0).style("text-anchor", "middle").text(d => d.data.status);
                
                svg.call(zoom.transform, d3.zoomIdentity.translate(container.clientWidth/4, container.clientHeight/2));
            } catch (error) {
                console.log("Struktur silsilah sedang menyesuaikan...", error);
            }
        });

        // =====================================
        // PROSES SIMPAN / UPDATE FIREBASE
        // =====================================
        formTambah.addEventListener('submit', (e) => {
            e.preventDefault();
            const nama = document.getElementById('input-nama').value;
            let status = selectStatus.value === 'Lainnya' ? inputStatusCustom.value : selectStatus.value;
            const parentId = document.getElementById('select-parent').value;

            push(wargaRef, {
                parentId: parentId, name: nama, status: status,
                lat: -6.8320 + (Math.random() - 0.5) * 0.005, lng: 108.2140 + (Math.random() - 0.5) * 0.005
            }).then(() => {
                modalTambah.classList.add('hidden'); modalTambah.classList.remove('flex');
                formTambah.reset(); inputStatusCustom.classList.add('hidden');
            });
        });

        formEdit.addEventListener('submit', (e) => {
            e.preventDefault();
            const dbKey = document.getElementById('edit-dbkey').value;
            const namaBaru = document.getElementById('edit-nama').value;
            const statusBaru = editSelectStatus.value === 'Lainnya' ? editStatusCustom.value : editSelectStatus.value;

            update(ref(db, 'silsilah_desa_v2/' + dbKey), { name: namaBaru, status: statusBaru }).then(() => {
                modalEdit.classList.add('hidden'); modalEdit.classList.remove('flex');
            });
        });
    </script>
</body>
</html>
